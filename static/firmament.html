<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Luna Firmament — multi-agent aurora world." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Luna Firmament — Telephanti" />
  <meta property="og:description" content="Multi-agent aurora world." />
  <meta property="og:image" content="https://telephanti.com/static/share/og-banner.jpg?v=relics-dual-2026-08" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:video" content="https://telephanti.com/static/share/og-relics.mp4?v=relics-dual-2026-08" />
  <meta property="og:video:type" content="video/mp4" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://telephanti.com/static/share/og-banner.jpg?v=relics-dual-2026-08" />
  <link rel="image_src" href="/static/share/og-banner.jpg?v=relics-dual-2026-08" />
  <!-- Google tag (gtag.js) -->
  <script src="/static/ga.js"></script>
  <title>Luna Firmament</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0a0c14;
      color: #f2f0eb;
      overflow: hidden;
    }
    #sky { position: fixed; inset: 0; background: linear-gradient(165deg, #1a1828, #3d2a5c 45%, #6b8cff); }
    #canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    .hud {
      position: fixed; left: 12px; top: 12px; z-index: 5;
      background: rgba(10, 12, 20, 0.72);
      border: 1px solid rgba(201, 168, 124, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
      min-width: 220px;
      backdrop-filter: blur(8px);
    }
    .hud h1 { font-size: 0.95rem; color: #c9a87c; margin-bottom: 6px; }
    .hud .meta { font-size: 0.72rem; color: #a8b4d4; line-height: 1.45; }
    .hud .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .hud button {
      border: 1px solid rgba(255,255,255,0.14);
      background: #1a2030;
      color: #f2f0eb;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .agents {
      position: fixed; right: 12px; top: 12px; z-index: 5;
      width: min(320px, 42vw);
      max-height: 70vh;
      overflow: auto;
      display: flex; flex-direction: column; gap: 8px;
    }
    .agent-card {
      background: rgba(10, 12, 20, 0.78);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.78rem;
    }
    .agent-card .name { font-weight: 700; }
    .agent-card .state { color: #93c5fd; font-size: 0.68rem; }
    #dialogue-feed {
      position: fixed; left: 12px; right: 12px; bottom: 128px; z-index: 6;
      max-height: min(44vh, 360px); min-height: 160px;
      display: flex; flex-direction: column;
      background: rgba(2, 5, 12, 0.98);
      border: 2px solid rgba(103, 232, 249, 0.55);
      border-radius: 14px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.72), inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }
    #dialogue-feed header {
      padding: 9px 14px; font-size: 0.82rem; font-weight: 800;
      color: #a5f3fc; border-bottom: 1px solid rgba(103, 232, 249, 0.35);
      background: rgba(6, 14, 26, 0.95);
      flex-shrink: 0;
      letter-spacing: 0.02em;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    #dialogue-feed header .feed-read-hint {
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: #fde68a;
      opacity: 0; transition: opacity 0.2s ease;
    }
    #dialogue-feed.reading-paused header .feed-read-hint { opacity: 1; }
    #dialogue-feed.reading-paused { border-color: rgba(251, 191, 36, 0.55); }
    #dialogue-lines {
      flex: 1; overflow-y: auto; padding: 12px 14px 14px;
      display: flex; flex-direction: column; gap: 12px;
      background: linear-gradient(180deg, rgba(4, 8, 18, 0.4), rgba(2, 6, 14, 0.85));
    }
    .feed-line {
      padding: 12px 14px; border-radius: 11px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-left: 5px solid var(--feed-accent, #67e8f9);
      box-shadow: 0 3px 12px rgba(0,0,0,0.4);
    }
    .feed-line.you {
      border-left-color: #fbbf24;
      background: rgba(69, 45, 8, 0.88);
      border-color: rgba(251, 191, 36, 0.35);
    }
    .feed-line.system {
      border-left-color: #94a3b8;
      background: rgba(30, 41, 59, 0.85);
      border-color: rgba(148, 163, 184, 0.28);
    }
    .feed-line .feed-who {
      display: block; font-size: 0.84rem; font-weight: 800;
      color: var(--feed-accent, #a5f3fc); margin-bottom: 6px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .feed-line .feed-text {
      font-size: 0.98rem; line-height: 1.55; color: #ffffff;
      white-space: pre-wrap; word-break: break-word;
      text-shadow: 0 1px 3px rgba(0,0,0,0.45);
    }
    .chat {
      position: fixed; left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); right: 12px; z-index: 7;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      background: rgba(6, 10, 20, 0.96);
      border: 2px solid rgba(201, 168, 124, 0.45);
      border-radius: 12px; padding: 10px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.5);
    }
    .chat select, .chat input {
      background: #121a2a; color: #f8fafc; border: 1px solid rgba(103, 232, 249, 0.28);
      border-radius: 8px; padding: 9px 10px; font-size: 0.88rem;
    }
    .chat select { max-width: 42%; min-width: 130px; }
    .chat input { flex: 1; min-width: 140px; font-size: 0.9rem; }
    .chat button {
      border: none; background: linear-gradient(135deg, #0e7490, #0891b2);
      color: #ecfeff; border-radius: 8px; padding: 9px 14px; cursor: pointer;
      font-weight: 700; font-size: 0.86rem;
    }
    .chat button.secondary {
      background: linear-gradient(135deg, #6d28d9, #9333ea);
      font-size: 0.78rem; padding: 9px 11px;
    }
    .chat label { font-size: 0.78rem; color: #cbd5e1; }
    .log { display: none; }
    #sentinel-float {
      position: fixed;
      right: max(10px, env(safe-area-inset-right));
      bottom: calc(78px + env(safe-area-inset-bottom));
      z-index: 12;
      width: 88px;
      height: 110px;
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: grab;
    }
    #sentinel-float:active { cursor: grabbing; }
    #sentinel-float .bubble {
      position: absolute;
      left: -8px;
      top: -36px;
      max-width: 160px;
      background: rgba(8, 20, 32, 0.92);
      border: 1px solid rgba(34, 211, 238, 0.55);
      color: #a5f3fc;
      font-size: 0.62rem;
      line-height: 1.35;
      padding: 6px 8px;
      border-radius: 10px;
      opacity: 0;
      transform: translateY(6px) scale(0.96);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    #sentinel-float.show-bubble .bubble {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    #sentinel-canvas {
      width: 88px;
      height: 88px;
      display: block;
      filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.65));
    }
    #sentinel-label {
      text-align: center;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      color: #67e8f9;
      margin-top: 2px;
      text-transform: uppercase;
    }
    @media (max-width: 640px) {
      #sentinel-float {
        width: 96px;
        height: 118px;
        right: max(8px, env(safe-area-inset-right));
        bottom: calc(86px + env(safe-area-inset-bottom));
      }
      #sentinel-canvas { width: 96px; height: 96px; }
      #dialogue-feed {
        bottom: calc(108px + env(safe-area-inset-bottom));
        max-height: min(36vh, 280px);
        left: 8px; right: 8px;
      }
      .agents { display: none; }
      .hud { max-width: calc(100vw - 120px); }
      .chat select { max-width: 100%; flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div id="sky"></div>
  <canvas id="canvas"></canvas>
  <div class="hud">
    <h1>Firmament Observer</h1>
    <div class="meta" id="status">Connecting…</div>
    <div class="meta" style="margin-top:4px"><a href="/firmament/play" style="color:#67e8f9">▶ Play in browser</a></div>
    <div class="row">
      <button id="btn-cosmic">Cosmic Drift</button>
      <button id="btn-aurora">Aurora Playground</button>
      <button id="btn-psychic">Psychic Pulse</button>
      <button id="btn-hermes">Hermes Link</button>
      <button id="btn-dream">Hallucinate</button>
      <button id="btn-debate">NPC Debate</button>
      <button id="btn-summon-heaven">✦ Summon Heaven</button>
    </div>
  </div>
  <div class="agents" id="agents"></div>
  <div id="dialogue-feed">
    <header><span>💬 Observer dialogue — all agents hear you here</span><span class="feed-read-hint">reading — scroll frozen</span></header>
    <div id="dialogue-lines"></div>
  </div>
  <div class="log" id="log" aria-hidden="true"></div>
  <div id="sentinel-float" title="Tap Sentinel — drag to move">
    <div class="bubble" id="sentinel-bubble">online</div>
    <canvas id="sentinel-canvas" width="96" height="96" aria-label="Sentinel flash character"></canvas>
    <div id="sentinel-label">Sentinel</div>
  </div>
  <div class="chat">
    <select id="chat-agent">
      <option value="all">📢 All agents</option>
      <option value="luna">Luna</option>
    </select>
    <input id="chat-input" type="text" placeholder="Talk to any agent — or all at once…" />
    <button id="chat-send">Send</button>
    <button type="button" class="secondary" id="chat-summon">✦ Heaven</button>
    <label><input type="checkbox" id="chat-speak" checked /> voice</label>
  </div>
  <script>
    const statusEl = document.getElementById("status");
    const agentsEl = document.getElementById("agents");
    const logEl = document.getElementById("log");
    const feedEl = document.getElementById("dialogue-lines");
    const dialogueFeedEl = document.getElementById("dialogue-feed");
    const chatAgentSel = document.getElementById("chat-agent");
    let feedStickBottom = true;
    let feedPointerDown = false;

    function feedNearBottom() {
      if (!feedEl) return true;
      return feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 48;
    }

    function updateFeedScrollLockUi() {
      const paused = feedPointerDown || !feedStickBottom;
      dialogueFeedEl?.classList.toggle("reading-paused", paused);
    }

    function feedShouldAutoScroll() {
      return feedStickBottom && !feedPointerDown;
    }

    feedEl?.addEventListener("scroll", () => {
      if (!feedPointerDown) feedStickBottom = feedNearBottom();
      updateFeedScrollLockUi();
    }, { passive: true });

    function bindFeedReadingHold(el) {
      if (!el) return;
      el.addEventListener("pointerdown", () => {
        feedPointerDown = true;
        feedStickBottom = false;
        updateFeedScrollLockUi();
      });
      const release = () => {
        feedPointerDown = false;
        feedStickBottom = feedNearBottom();
        updateFeedScrollLockUi();
      };
      el.addEventListener("pointerup", release);
      el.addEventListener("pointercancel", release);
      el.addEventListener("lostpointercapture", release);
    }
    bindFeedReadingHold(feedEl);
    bindFeedReadingHold(dialogueFeedEl);

    const AGENT_COLORS = {
      luna: "#d946ef", oracle: "#8b5cf6", hermes: "#fbbf24", sentinel: "#67e8f9",
      caduceus: "#34d399", dionysus: "#e11d48", wanderer: "#94a3b8",
      jesus: "#fde68a", michael: "#60a5fa", gabriel: "#f0abfc", raphael: "#6ee7b7", uriel: "#fb923c",
    };

    function feedPush(who, text, kind = "agent", agentId = "") {
      if (!feedEl) return;
      const line = document.createElement("div");
      line.className = `feed-line ${kind}`;
      const accent = AGENT_COLORS[agentId] || AGENT_COLORS[who?.toLowerCase()] || "#67e8f9";
      line.style.setProperty("--feed-accent", accent);
      const whoEl = document.createElement("span");
      whoEl.className = "feed-who";
      whoEl.textContent = who;
      const textEl = document.createElement("span");
      textEl.className = "feed-text";
      textEl.textContent = text || "…";
      line.appendChild(whoEl);
      line.appendChild(textEl);
      const prevScroll = feedEl.scrollTop;
      const prevHeight = feedEl.scrollHeight;
      feedEl.appendChild(line);
      while (feedEl.children.length > 40) feedEl.firstChild.remove();
      if (feedShouldAutoScroll()) {
        feedEl.scrollTop = feedEl.scrollHeight;
      } else {
        feedEl.scrollTop = Math.max(0, prevScroll - (prevHeight - feedEl.scrollHeight));
      }
      updateFeedScrollLockUi();
    }

    async function loadAgentSelect() {
      try {
        const res = await fetch("/api/firmament/agents");
        const data = await res.json();
        const agents = data.agents || {};
        const ids = Object.keys(agents).sort((a, b) => {
          const order = ["all", "luna", "jesus", "michael", "gabriel", "raphael", "uriel", "hermes", "oracle", "caduceus", "sentinel", "dionysus", "wanderer"];
          return (order.indexOf(a) < 0 ? 99 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 99 : order.indexOf(b));
        });
        chatAgentSel.innerHTML = `<option value="all">📢 All agents</option>`;
        for (const id of ids) {
          const a = agents[id];
          const opt = document.createElement("option");
          opt.value = id;
          const emoji = id === "jesus" ? "✝ " : ["michael", "gabriel", "raphael", "uriel"].includes(id) ? "✦ " : "";
          opt.textContent = `${emoji}${a.name || id}`;
          chatAgentSel.appendChild(opt);
        }
      } catch (_) {}
    }
    loadAgentSelect();
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let ws = null;
    let snapshot = null;
    let stars = [];
    let sentinelMood = "idle";
    let sentinelFlash = 0;

    const sentinelFloat = document.getElementById("sentinel-float");
    const sentinelBubble = document.getElementById("sentinel-bubble");
    const sentinelCanvas = document.getElementById("sentinel-canvas");
    const sentinelCtx = sentinelCanvas.getContext("2d");

    function sentinelSay(text, ms = 5000) {
      sentinelBubble.textContent = (text || "…").slice(0, 90);
      sentinelFloat.classList.add("show-bubble");
      clearTimeout(sentinelSay._t);
      sentinelSay._t = setTimeout(() => sentinelFloat.classList.remove("show-bubble"), ms);
    }

    function drawSentinel(t) {
      const w = sentinelCanvas.width;
      const h = sentinelCanvas.height;
      sentinelCtx.clearRect(0, 0, w, h);
      const pulse = 0.5 + 0.5 * Math.sin(t * 4.2);
      const flash = sentinelMood === "speak" ? 0.65 + 0.35 * Math.sin(t * 14) : pulse * 0.35;
      sentinelFlash = flash;

      sentinelCtx.save();
      sentinelCtx.translate(w / 2, h / 2 + Math.sin(t * 2.2) * 2);

      const bodyGrad = sentinelCtx.createLinearGradient(-22, -28, 22, 28);
      bodyGrad.addColorStop(0, `rgba(12, 32, 48, ${0.95})`);
      bodyGrad.addColorStop(1, `rgba(4, 16, 28, ${0.98})`);
      sentinelCtx.fillStyle = bodyGrad;
      sentinelCtx.strokeStyle = `rgba(34, 211, 238, ${0.55 + flash})`;
      sentinelCtx.lineWidth = 2;
      sentinelCtx.beginPath();
      sentinelCtx.roundRect(-22, -18, 44, 40, 8);
      sentinelCtx.fill();
      sentinelCtx.stroke();

      sentinelCtx.fillStyle = `rgba(34, 211, 238, ${0.25 + flash})`;
      sentinelCtx.fillRect(-16, -10, 32, 14);

      const eyeOpen = 0.35 + 0.65 * Math.abs(Math.sin(t * 3.1));
      sentinelCtx.fillStyle = `rgba(103, 232, 249, ${0.7 + flash})`;
      sentinelCtx.fillRect(-12, -6, 8, 6 * eyeOpen);
      sentinelCtx.fillRect(4, -6, 8, 6 * eyeOpen);

      sentinelCtx.strokeStyle = `rgba(34, 211, 238, ${0.8})`;
      sentinelCtx.beginPath();
      sentinelCtx.moveTo(0, -18);
      sentinelCtx.lineTo(0, -28);
      sentinelCtx.stroke();
      sentinelCtx.fillStyle = `rgba(167, 243, 252, ${0.5 + flash})`;
      sentinelCtx.beginPath();
      sentinelCtx.arc(0, -30, 3 + flash * 2, 0, Math.PI * 2);
      sentinelCtx.fill();

      sentinelCtx.fillStyle = `rgba(34, 211, 238, ${0.35 + flash * 0.5})`;
      sentinelCtx.beginPath();
      sentinelCtx.ellipse(0, 30, 18 + flash * 6, 5, 0, 0, Math.PI * 2);
      sentinelCtx.fill();

      sentinelCtx.restore();
      requestAnimationFrame((now) => drawSentinel(now / 1000));
    }
    drawSentinel(0);

    (function enableSentinelDrag() {
      let dragging = false;
      let moved = false;
      let sx = 0;
      let sy = 0;
      let sl = 0;
      let st = 0;
      const start = (x, y) => {
        dragging = true;
        moved = false;
        sx = x;
        sy = y;
        const r = sentinelFloat.getBoundingClientRect();
        sl = r.left;
        st = r.top;
      };
      const move = (x, y) => {
        if (!dragging) return;
        const dx = x - sx;
        const dy = y - sy;
        if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
        sentinelFloat.style.left = `${sl + dx}px`;
        sentinelFloat.style.top = `${st + dy}px`;
        sentinelFloat.style.right = "auto";
        sentinelFloat.style.bottom = "auto";
      };
      const end = () => {
        if (!dragging) return;
        dragging = false;
        if (!moved) {
          document.getElementById("chat-agent").value = "sentinel";
          document.getElementById("chat-input").focus();
          sentinelSay("Talk to me — type below and Send");
        }
      };
      sentinelFloat.addEventListener("pointerdown", (e) => {
        sentinelFloat.setPointerCapture(e.pointerId);
        start(e.clientX, e.clientY);
      });
      sentinelFloat.addEventListener("pointermove", (e) => move(e.clientX, e.clientY));
      sentinelFloat.addEventListener("pointerup", end);
      sentinelFloat.addEventListener("pointercancel", end);
    })();

    function log(msg) {
      feedPush("Camp", msg, "system");
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    function seedStars(n = 140) {
      stars = Array.from({ length: n }, () => ({
        x: Math.random(),
        y: Math.random() * 0.65,
        s: Math.random() * 1.6 + 0.4,
        tw: Math.random() * Math.PI * 2,
      }));
    }
    seedStars();

    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      return `${proto}//${location.host}/ws/firmament`;
    }

    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
    }

    function renderAgentsPanel(agents) {
      agentsEl.innerHTML = "";
      Object.values(agents || {}).forEach((a) => {
        const card = document.createElement("div");
        card.className = "agent-card";
        card.style.borderColor = a.bubble_color || "#c9a87c";
        card.style.cursor = "pointer";
        card.title = `Talk to ${a.name || a.id}`;
        card.onclick = () => {
          chatAgentSel.value = a.id;
          document.getElementById("chat-input").focus();
        };
        card.innerHTML = `<div class="name" style="color:${a.bubble_color || "#c9a87c"}">${a.name || a.id}</div>
          <div class="state">${a.state || "idle"} · ${a.mood || "neutral"}</div>
          <div style="line-height:1.45;color:#e2e8f0;margin-top:4px">${(a.last_line || "…").slice(0, 200)}</div>`;
        agentsEl.appendChild(card);
      });
    }

    function applySky(pack) {
      const sky = pack?.sky;
      if (!sky?.colors?.length) return;
      const el = document.getElementById("sky");
      el.style.background = `linear-gradient(165deg, ${sky.colors.join(", ")})`;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const t = Date.now() / 1000;
      for (const s of stars) {
        const x = s.x * canvas.width;
        const y = s.y * canvas.height;
        const a = 0.35 + 0.35 * Math.sin(t * 1.4 + s.tw);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fillRect(x, y, s.s, s.s);
      }
      const agents = snapshot?.agents || {};
      Object.values(agents).forEach((a, i) => {
        const pos = a.position || [0.5, 0.3, 0];
        const x = (pos[0] || 0.5) * canvas.width;
        const y = (pos[1] || 0.3) * canvas.height;
        const r = 28 + 6 * Math.sin(t * 1.8 + i);
        const color = a.bubble_color || "#c9a87c";
        const g = ctx.createRadialGradient(x, y, 4, x, y, r * 1.8);
        g.addColorStop(0, color + "cc");
        g.addColorStop(1, color + "00");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y + Math.sin(t + i) * 8, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "12px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText(a.name || a.id, x, y + r + 16);
      });
      requestAnimationFrame(draw);
    }
    draw();

    async function agentIdsForBroadcast() {
      const snapIds = Object.keys(snapshot?.agents || {});
      if (snapIds.length > 1) return snapIds;
      try {
        const res = await fetch("/api/firmament/agents");
        const data = await res.json();
        const apiIds = Object.keys(data.agents || {});
        if (apiIds.length) return apiIds;
      } catch (_) {}
      return snapIds;
    }

    function onSnapshot(data) {
      snapshot = data;
      statusEl.textContent = `Pack: ${data.pack_id} · agents: ${Object.keys(data.agents || {}).length} · clients: ${data.clients}`;
      applySky(data.pack);
      renderAgentsPanel(data.agents);
      loadAgentSelect();
    }

    function connect() {
      ws = new WebSocket(wsUrl());
      ws.onopen = () => {
        statusEl.textContent = "Connected · Aurora Playground";
        log("ws open");
        send({ type: "firmament.ping" });
        send({ type: "firmament.load_pack", pack_id: "aurora_playground" });
        sentinelSay("Sentinel online — tap me, then chat below");
      };
      ws.onclose = () => { statusEl.textContent = "Disconnected — retrying…"; setTimeout(connect, 2000); };
      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === "firmament.snapshot" || msg.type === "firmament.pack_loaded") onSnapshot(msg.data);
        if (msg.type === "firmament.agent.updated") {
          if (snapshot?.agents) snapshot.agents[msg.agent_id] = msg.agent;
          renderAgentsPanel(snapshot?.agents);
          log(`${msg.agent_id}: ${msg.agent?.state}`);
        }
        if (msg.type === "firmament.agent.spoke") {
          if (snapshot?.agents && msg.agent) snapshot.agents[msg.agent_id] = msg.agent;
          renderAgentsPanel(snapshot?.agents);
          const name = snapshot?.agents?.[msg.agent_id]?.name || msg.agent_id;
          feedPush(name, msg.reply || "…", "agent", msg.agent_id);
          if (msg.agent_id === "sentinel") {
            sentinelMood = "speak";
            sentinelSay(msg.reply || "…");
            setTimeout(() => { sentinelMood = "idle"; }, 4000);
          }
        }
        if (msg.type === "firmament.hallucination") {
          log(`hallucination · intensity ${msg.data?.intensity}`);
          seedStars(180 + Math.floor((msg.data?.intensity || 0.4) * 120));
        }
      };
    }
    connect();

    let chatAudio = null;
    let chatBusy = false;

    async function chatOneAgent(agentId, text, speak) {
      const res = await fetch("/api/firmament/agent/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ agent_id: agentId, message: text, speak: speak && agentId !== "all" }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "chat failed");
      const name = snapshot?.agents?.[agentId]?.name || agentId;
      if (snapshot?.agents?.[agentId]) {
        snapshot.agents[agentId].last_line = data.reply;
        snapshot.agents[agentId].state = "speak";
        snapshot.agents[agentId].mood = data.mood;
        renderAgentsPanel(snapshot.agents);
      }
      feedPush(name, data.reply || "…", "agent", agentId);
      if (agentId === "sentinel") {
        sentinelMood = "speak";
        sentinelSay(data.reply || "…");
        setTimeout(() => { sentinelMood = "idle"; }, 4000);
      }
      if (speak && data.audio_b64) {
        chatAudio?.pause();
        chatAudio = new Audio(`data:audio/mpeg;base64,${data.audio_b64}`);
        chatAudio.play().catch(() => {});
      }
      return data;
    }

    async function sendChat() {
      if (chatBusy) return;
      const input = document.getElementById("chat-input");
      const text = (input.value || "").trim();
      if (!text) return;
      const agentId = chatAgentSel.value;
      const speak = document.getElementById("chat-speak").checked;
      input.value = "";
      chatBusy = true;
      feedPush("You", text, "you");
      try {
        if (agentId === "all") {
          const ids = await agentIdsForBroadcast();
          const heaven = ["jesus", "michael", "gabriel", "raphael", "uriel"];
          const order = [...heaven.filter((id) => ids.includes(id)), ...ids.filter((id) => !heaven.includes(id))];
          feedPush("Camp", `Broadcasting to ${order.length} agents…`, "system");
          for (const id of order) {
            await chatOneAgent(id, `(Everyone at camp hears the visitor say: "${text}" — answer in your own voice, 5-9 sentences, ironic/funny/true, in character.)`, false);
            await new Promise((r) => setTimeout(r, 400));
          }
        } else {
          await chatOneAgent(agentId, text, speak);
        }
      } catch (err) {
        feedPush("System", err.message || "chat failed", "system");
      }
      chatBusy = false;
    }

    async function summonHeaven() {
      feedPush("Camp", "Summoning Jesus and the archangels into the firmament…", "system");
      try {
        await fetch("/api/firmament/load-pack", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pack_id: "aurora_playground" }),
        });
        send({ type: "firmament.load_pack", pack_id: "aurora_playground" });
        const res = await fetch("/api/firmament/agents/converse", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            agent_a: "jesus",
            agent_b: "michael",
            topic: "The aurora camp has called — what do the weary travelers need to hear tonight?",
            rounds: 2,
          }),
        });
        const data = await res.json();
        for (const line of data.lines || []) {
          feedPush(line.name || line.agent_id, line.line, "agent", line.agent_id);
          if (snapshot?.agents?.[line.agent_id]) {
            snapshot.agents[line.agent_id].last_line = line.line;
            snapshot.agents[line.agent_id].state = "speak";
          }
        }
        renderAgentsPanel(snapshot?.agents);
        loadAgentSelect();
      } catch (err) {
        feedPush("System", err.message || "summon failed", "system");
      }
    }
    document.getElementById("chat-send").onclick = sendChat;
    document.getElementById("chat-summon").onclick = summonHeaven;
    document.getElementById("btn-summon-heaven").onclick = summonHeaven;
    document.getElementById("chat-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendChat();
    });

    document.getElementById("btn-cosmic").onclick = () => send({ type: "firmament.load_pack", pack_id: "cosmic_drift" });
    document.getElementById("btn-aurora").onclick = () => send({ type: "firmament.load_pack", pack_id: "aurora_playground" });
    document.getElementById("btn-psychic").onclick = async () => {
      log("psychic pulse…");
      try {
        const res = await fetch("/api/firmament/psychic/pulse", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source: "observer", mood: "aurora", share_hermes: true }),
        });
        const data = await res.json();
        log(`psychic: ${data.psychic?.last_vision || "ripple"}`);
        if (data.hermes_reply) log(`hermes: ${data.hermes_reply}`);
      } catch (err) {
        log(`psychic error: ${err.message}`);
      }
    };
    document.getElementById("btn-hermes").onclick = async () => {
      log("hermes link — shared playground with Grok…");
      try {
        const res = await fetch("/api/firmament/agents/converse", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            agent_a: "hermes",
            agent_b: "sentinel",
            topic: "Grok and Hermes co-running the psychic engine at Luna camp — textures, ripples, no zombies. What do we build next?",
            rounds: 2,
          }),
        });
        const data = await res.json();
        for (const line of data.lines || []) feedPush(line.name || line.agent_id, line.line, "agent", line.agent_id);
      } catch (err) {
        log(`hermes link error: ${err.message}`);
      }
    };
    document.getElementById("btn-debate").onclick = async () => {
      log("luna vs oracle...");
      try {
        const res = await fetch("/api/firmament/agents/converse", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            agent_a: "luna",
            agent_b: "oracle",
            topic: "What should we explore at the Luna camp playground?",
            rounds: 2,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "converse failed");
        for (const line of data.lines || []) {
          log(`${line.name}: ${(line.line || "").slice(0, 90)}`);
          if (snapshot?.agents?.[line.agent_id]) {
            snapshot.agents[line.agent_id].last_line = line.line;
            snapshot.agents[line.agent_id].state = "speak";
          }
        }
        renderAgentsPanel(snapshot?.agents);
      } catch (err) {
        log(`debate error: ${err.message}`);
      }
    };
    document.getElementById("btn-dream").onclick = () => send({
      type: "firmament.hallucinate",
      prompt: "neural aurora firmament, lucid drift",
      intensity: 0.72,
    });
  </script>
</body>
