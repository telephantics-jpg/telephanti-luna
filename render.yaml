# telephanti.com — Luna Camp on Render (free minds; no paid Grok by default)
services:
  - type: web
    name: luna
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: LUNA_CLOUD
        value: "1"
      - key: LUNA_HOST
        value: 0.0.0.0
      - key: LUNA_PUBLIC_URL
        value: https://telephanti.com
      # Free minds only — Ollama is local-only; live uses free cloud keys below
      - key: LUNA_LLM_BACKEND
        value: free
      - key: LUNA_FREE_BRAINS
        value: "1"
      - key: LUNA_FORCE_OLLAMA
        value: "0"
      - key: PREFER_OLLAMA
        value: "0"
      - key: LUNA_ALLOW_GROK
        value: "0"
      - key: LUNA_USER_GROK
        value: "1"
      - key: LUNA_DISABLE_GROK
        value: "0"
      - key: LUNA_DISABLE_USER_GROK
        value: "0"
      - key: LUNA_GROK_FALLBACK
        value: "0"
      # Optional: paid Grok for *user chat only* (ambient stays free/Ollama)
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4-fast-non-reasoning
      # Free open-model hosts (set secrets in Render dashboard)
      # Google Gemini free (AI Studio) — preferred for camp comedy + chill truth
      # https://aistudio.google.com/apikey
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: LUNA_PREFER_GEMINI
        value: "1"
      # Groq free: https://console.groq.com
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.1-8b-instruct:free
      - key: TTS_VOICE
        value: en-US-AriaNeural
      - key: LUNA_LIPSYNC
        value: "0"
      - key: LUNA_PREWARM
        value: "0"
