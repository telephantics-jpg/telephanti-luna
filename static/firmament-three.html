<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Luna Camp — Three.js 3D</title>
  <!-- Bust SW/browser cache; three r160 is one self-contained module (no three.core.js) -->
  <script type="importmap">
  {
    "imports": {
      "three": "/static/vendor/three/build/three.module.js?v=r160mono",
      "three/addons/": "/static/vendor/three/examples/jsm/"
    }
  }
  </script>
  <script>
    // Kill stale service workers that cache-first'd a broken three.module.js graph
    (function () {
      try {
        if (navigator.serviceWorker) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #020617;
      --panel: rgba(8, 14, 28, 0.88);
      --cyan: #67e8f9;
      --violet: #c4b5fd;
      --amber: #fbbf24;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: rgba(103, 232, 249, 0.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse 120% 80% at 50% -10%, rgba(52, 211, 153, 0.22), transparent 50%),
        radial-gradient(ellipse 90% 60% at 80% 20%, rgba(129, 140, 248, 0.28), transparent 45%),
        radial-gradient(ellipse 70% 50% at 15% 60%, rgba(244, 114, 182, 0.12), transparent 40%),
        linear-gradient(180deg, #07101f 0%, #0c1a3a 40%, #0a1628 70%, #061018 100%);
    }
    #canvas-host { position: fixed; inset: 0; z-index: 1; }
    #canvas-host canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #album-btn {
      border-color: #7dd3fc !important;
      background: linear-gradient(135deg, rgba(12, 74, 110, 0.95), rgba(2, 132, 199, 0.9)) !important;
      color: #e0f2fe !important;
      font-weight: 800 !important;
      letter-spacing: 0.02em;
    }
    #album-btn.playing {
      border-color: #fbbf24 !important; color: #fde68a !important;
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.35);
    }
    /* TX music + site link stacked (not center — sits in topbar next to TX) */
    .tx-cluster {
      display: inline-flex; flex-direction: column; align-items: stretch; gap: 3px;
      pointer-events: auto;
    }
    .tx-cluster #album-btn { width: 100%; text-align: center; padding: 5px 12px; }
    #telephanti-site-btn {
      border-color: rgba(125, 211, 252, 0.55) !important;
      background: rgba(8, 20, 40, 0.92) !important;
      color: #7dd3fc !important;
      font-weight: 700 !important;
      font-size: 0.62rem !important;
      padding: 3px 8px !important;
      letter-spacing: 0.03em;
      text-align: center;
      line-height: 1.2;
    }
    #telephanti-site-btn:hover {
      border-color: #fbbf24 !important;
      color: #fde68a !important;
    }
    /* Always-visible home — top-left, not center */
    #home-telephanti {
      border-color: rgba(251, 191, 36, 0.55) !important;
      background: linear-gradient(135deg, rgba(66, 32, 6, 0.95), rgba(180, 83, 9, 0.75)) !important;
      color: #fef3c7 !important;
      font-weight: 800 !important;
      font-size: 0.75rem !important;
      white-space: nowrap;
    }
    #home-telephanti:hover {
      border-color: #fde68a !important;
      color: #fffbeb !important;
    }
    #album-now {
      font-size: 0.68rem; color: #fde68a; max-width: 160px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: max(8px, env(safe-area-inset-top)) 12px 10px;
      background: linear-gradient(180deg, rgba(2,6,23,0.92), rgba(2,6,23,0.55) 70%, transparent);
      pointer-events: none;
    }
    #topbar > * { pointer-events: auto; }
    #topbar a, #topbar button, .chip {
      color: var(--cyan); text-decoration: none; background: var(--panel);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 6px 12px; font-size: 0.78rem; cursor: pointer; font: inherit;
    }
    #topbar a:hover, #topbar button:hover, .chip:hover { border-color: var(--cyan); background: rgba(15, 30, 50, 0.95); }
    #status { flex: 1; min-width: 120px; color: var(--muted); font-size: 0.78rem; }
    #stamp {
      font-size: 0.7rem; color: #7dd3fc; border: 1px solid rgba(56,189,248,0.45);
      border-radius: 8px; padding: 4px 8px; background: rgba(8,20,40,0.75);
    }

    /* Above canvas/dock/feature dock so speech is always clickable on PC */
    #speech-layer {
      position: fixed; inset: 0; z-index: 200;
      pointer-events: none; /* layer itself never steals clicks — only .bubble3d */
      overflow: visible;
    }
    .bubble3d {
      position: fixed; /* fixed to viewport — reliable PC hit targets in 3D view */
      /* Fixed frame — text content still updates dynamically */
      width: min(248px, 72vw);
      height: 112px;
      box-sizing: border-box;
      transform: translate(-50%, -100%);
      background: rgba(8, 14, 28, 0.94);
      border: 2px solid rgba(196, 181, 253, 0.55);
      border-radius: 14px; padding: 8px 12px;
      font-size: clamp(0.72rem, 2.4vw, 0.85rem); line-height: 1.35;
      color: #f1f5f9; box-shadow: 0 8px 28px rgba(0,0,0,0.35);
      animation: pop 0.22s ease-out;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      /* Critical: only bubbles take hits; layer stays passthrough */
      pointer-events: auto !important;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      /* JS owns stacking via inline z-index — do NOT use !important here */
      z-index: 210;
      isolation: isolate;
    }
    .bubble3d:hover {
      border-color: rgba(251, 191, 36, 0.85);
      filter: brightness(1.08);
      box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.4), 0 10px 32px rgba(0,0,0,0.45);
    }
    .bubble3d:focus-visible {
      outline: 2px solid #fbbf24;
      outline-offset: 2px;
    }
    .bubble3d .who, .bubble3d .say {
      display: block;
      pointer-events: none; /* clicks always hit the bubble box, not text nodes */
    }
    .bubble3d .who { font-weight: 700; color: var(--violet); font-size: 0.72rem; margin-bottom: 3px; }
    .bubble3d .front-chip {
      position: absolute; top: -10px; right: 8px;
      font-size: 0.62rem; font-weight: 800; letter-spacing: 0.04em;
      background: #fde68a; color: #1c1917;
      border-radius: 6px; padding: 2px 7px; line-height: 1.2;
      pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
    .bubble3d.locked .front-chip {
      background: #34d399; color: #052e1a;
    }
    .bubble3d.dimmed {
      opacity: 0.55 !important;
      filter: saturate(0.65);
      /* stay clickable under a large FRONT box when their rect sticks out */
      pointer-events: auto !important;
    }
    /* Long-press lock — never auto-hide, stays readable on phone */
    .bubble3d.locked {
      border-color: #34d399 !important;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.7), 0 14px 40px rgba(0,0,0,0.55) !important;
      opacity: 1 !important;
      filter: none !important;
      background: rgba(6, 28, 22, 0.97) !important;
      height: 120px !important;
      max-height: 120px !important;
      min-height: 120px !important;
    }
    .bubble3d.holding {
      border-color: #fbbf24 !important;
      outline: 2px solid rgba(251, 191, 36, 0.55);
    }
    @keyframes pop { from { opacity: 0; transform: translate(-50%, -90%) scale(0.92); } to { opacity: 1; transform: translate(-50%, -100%) scale(1); } }

    #dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
      padding: 0 12px max(12px, env(safe-area-inset-bottom));
      background: linear-gradient(0deg, rgba(2,6,23,0.96), rgba(2,6,23,0.75) 60%, transparent);
      display: flex; flex-direction: column; gap: 8px;
    }
    /* Selected bubble — gold FRONT like 2D camp (JS sets z-index per pick — no fixed 999) */
    .bubble3d.front {
      border-color: #fde68a !important;
      box-shadow: 0 0 0 3px rgba(253, 230, 138, 0.85), 0 14px 40px rgba(0,0,0,0.6) !important;
      /* keep same frame size as others so one agent doesn't cover every other chat */
      height: 120px !important;
      max-height: 120px !important;
      min-height: 120px !important;
      opacity: 1 !important;
      filter: none !important;
      background: rgba(12, 20, 40, 0.98) !important;
    }
    #talk-row {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    #who-select {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 10px; font: inherit; min-width: 110px;
    }
    #msg {
      flex: 1; min-width: 140px; background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px;
      font: inherit; font-size: 0.92rem;
    }
    #msg:focus, #who-select:focus { outline: 1px solid var(--cyan); }
    #send, #banter {
      background: linear-gradient(135deg, rgba(67, 56, 202, 0.85), rgba(14, 116, 144, 0.9));
      border: 1px solid rgba(103, 232, 249, 0.4); color: #ecfeff;
      border-radius: 12px; padding: 11px 16px; font: inherit; font-weight: 600; cursor: pointer;
    }
    #send:disabled { opacity: 0.5; cursor: wait; }
    #hint {
      font-size: 0.68rem; color: #64748b; text-align: center; padding-bottom: 2px;
    }
    #prop-toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 30; pointer-events: none; opacity: 0; transition: opacity 0.25s;
      background: rgba(8,14,28,0.94); border: 1px solid var(--amber);
      border-radius: 14px; padding: 12px 18px; font-size: 0.9rem; max-width: 80vw; text-align: center;
    }
    #prop-toast.show { opacity: 1; }
    #quick-bar {
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    }
    #quick-bar button {
      background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); color: var(--cyan);
      border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 0.75rem; cursor: pointer;
      min-height: 40px;
    }
    #quick-bar button:active { transform: scale(0.97); background: rgba(34, 211, 238, 0.15); }
    #mode-pill {
      position: fixed; top: max(52px, calc(env(safe-area-inset-top) + 44px)); left: 50%;
      transform: translateX(-50%); z-index: 22;
      background: rgba(8,14,28,0.88); border: 1px solid var(--border); border-radius: 999px;
      padding: 6px 14px; font-size: 0.72rem; color: #a5f3fc; pointer-events: none;
    }
    .bubble3d {
      width: min(260px, 78vw) !important;
      height: 120px !important;
      font-size: clamp(0.8rem, 2.6vw, 0.95rem) !important;
      border-width: 2px !important;
    }
    #ground-marker {
      /* rendered in 3d */
    }
    @media (max-width: 640px) {
      #hint { font-size: 0.62rem; }
      #who-select { min-width: 90px; }
    }
  </style>
</head>
<body>
  <div id="canvas-host"></div>
  <div id="speech-layer"></div>
  <div id="prop-toast"></div>
  <div id="mode-pill">👆 Tap speech = FRONT · Hold = 🔒 lock · Left: ✦ menu</div>

  <header id="topbar">
    <a id="home-telephanti" class="chip" href="https://telephanti.com/" title="Back to telephanti.com home">← Home</a>
    <div class="tx-cluster" title="Telephantix music + site">
      <button type="button" id="album-btn" class="chip" title="Play music — full Telephantix queue">Play music</button>
      <a id="telephanti-site-btn" class="chip" href="https://telephanti.com/" title="Back to telephanti.com">telephanti.com</a>
    </div>
    <span id="album-now" hidden></span>
    <button type="button" id="btn-reset-cam" class="chip">Find me</button>
    <button type="button" id="btn-follow" class="chip" title="Camera follow">Follow</button>
    <button type="button" id="btn-banter-top" class="chip">💬</button>
    <button type="button" id="btn-roam" class="chip">🏃</button>
    <span id="status" hidden>Loading…</span>
    <span id="stamp">✦ 3D</span>
  </header>
  <div id="boot-error" hidden style="position:fixed;inset:auto 12px 120px 12px;z-index:40;background:rgba(80,10,20,0.95);border:1px solid #f87171;border-radius:12px;padding:14px 16px;color:#fecaca;font-size:0.85rem;line-height:1.45;max-width:560px;margin:0 auto;left:12px;right:12px;"></div>

  <div id="dock">
    <div id="quick-bar">
      <button type="button" data-q="hey">👋 Hey</button>
      <button type="button" data-q="joke">😄 Joke</button>
      <button type="button" data-q="news">📰 Pulse</button>
      <button type="button" data-q="love">💜 Love</button>
      <button type="button" id="banter">💬 Banter</button>
    </div>
    <div id="talk-row">
      <select id="who-select" aria-label="Talk to"></select>
      <input id="msg" type="text" maxlength="500" placeholder="Or type… tap agent first" autocomplete="off" />
      <button type="button" id="send">Send</button>
    </div>
    <div id="hint">Tap a speech box to bring it FRONT · Hold to 🔒 lock · Tap meadow to walk</div>
  </div>

  <script type="module">
    const BUILD = "2026-07-16-three-v30-home-btn";
    const statusEl = document.getElementById("status");
    const bootErr = document.getElementById("boot-error");
    function showBootError(msg) {
      console.error(msg);
      if (statusEl) statusEl.textContent = "3D failed to load — see red box";
      if (bootErr) {
        bootErr.hidden = false;
        bootErr.innerHTML =
          `<b>Three.js camp failed to start</b><br>${msg}` +
          `<br><br>Try: <b>Ctrl+Shift+R</b> hard refresh · open only via ` +
          `<code>http://127.0.0.1:8767/firmament/3d</code> (server must be running).` +
          `<br>If still stuck: DevTools → Application → clear site data, then reload.`;
      }
    }

    // Absolute URLs + cache bust (import map alone can stick on old broken modules)
    const THREE_URL = "/static/vendor/three/build/three.module.js?v=r160mono";
    const ORBIT_URL = "/static/vendor/three/examples/jsm/controls/OrbitControls.js?v=r160mono";

    let THREE, OrbitControls, campWorld, campClient, campFeatures, charSystem;
    try {
      statusEl.textContent = "Loading Three.js…";
      const head = await fetch(THREE_URL, { cache: "no-store" });
      if (!head.ok) throw new Error(`three.module.js HTTP ${head.status}`);
      THREE = await import(THREE_URL);
      ({ OrbitControls } = await import(ORBIT_URL));
      const { GLTFLoader } = await import("/static/vendor/three/examples/jsm/loaders/GLTFLoader.js");
      let SkeletonUtils = null;
      try {
        SkeletonUtils = await import("/static/vendor/three/examples/jsm/utils/SkeletonUtils.js");
      } catch (_) {
        SkeletonUtils = null;
      }
      campWorld = await import(`/static/camp/camp-world.mjs?v=${BUILD}`);
      campClient = await import(`/static/camp/camp-client.mjs?v=${BUILD}`);
      campFeatures = await import(`/static/camp/camp-features.mjs?v=${BUILD}`);
      const campChars = await import(`/static/camp/camp-characters.mjs?v=${BUILD}`);
      charSystem = campChars.createCharacterSystem(THREE, GLTFLoader, SkeletonUtils);
      if (!THREE || !THREE.WebGLRenderer) throw new Error("Three.js loaded but WebGLRenderer missing");
      statusEl.textContent = "Loading world catalog…";
    } catch (err) {
      showBootError(String(err && err.message ? err.message : err));
      throw err;
    }

    const stampEl = document.getElementById("stamp");
    const whoEl = document.getElementById("who-select");
    const msgEl = document.getElementById("msg");
    const sendBtn = document.getElementById("send");
    const toastEl = document.getElementById("prop-toast");
    const speechLayer = document.getElementById("speech-layer");
    // 3D camp: no scrolling chat log UI — only world speech bubbles + toast
    let bubbleFrontZ = 220;

    const isLocal = location.hostname === "127.0.0.1" || location.hostname === "localhost";
    stampEl.textContent = isLocal ? `✦ SANDBOX 3D · ${BUILD}` : `✦ 3D THREE · ${BUILD}`;
    stampEl.style.borderColor = isLocal ? "#38bdf8" : "rgba(56,189,248,0.45)";

    // ── Shared world catalog (architecture layer B) ──
    let catalog;
    let catalogSource = "unknown";
    try {
      catalog = await campWorld.fetchCampCatalog();
      catalogSource = catalog._source || "loaded";
    } catch (err) {
      console.warn("catalog load failed, embedded fallback", err);
      catalog = campWorld.fallbackCatalog();
      catalogSource = "embedded";
    }
    // Safety: never boot with <5 props
    if (!(catalog.props && catalog.props.length >= 5)) {
      const fb = campWorld.fallbackCatalog();
      catalog = { ...fb, ...catalog, props: fb.props, furniture: fb.furniture || catalog.furniture };
      catalogSource = (catalogSource || "") + "+propsfix";
    }
    console.info("[camp3d] catalog", catalogSource, "props", (catalog.props || []).length, "agents", (catalog.agents || []).length, "furniture", (catalog.furniture || []).length);

    const SCALE = campWorld.threeScale(catalog);
    const PROPS = (catalog.props || []).map((p) => ({
      id: p.id,
      name: p.name || p.id,
      emoji: p.emoji || "✦",
      x: p.x ?? 0,
      y: p.y ?? 0,
      color: campWorld.parseColorNumber(p.visual?.primary, 0x888888),
      use: p.use || `You use ${p.name || p.id}.`,
      visual: p.visual || {},
      feature: p.feature || "",
    }));
    const HOUSES = (catalog.houses || []).map((h) => ({
      id: h.owner_id || h.id,
      catalogId: h.id,
      name: h.name || h.id,
      emoji: h.emoji || "🏠",
      x: h.x ?? 0,
      y: h.y ?? 0,
      wall: campWorld.parseColorNumber(h.visual?.primary, 0x555555),
      roof: campWorld.parseColorNumber(h.visual?.roof || h.visual?.accent, 0x333333),
      castle: !!h.castle || h.visual?.kit === "mead_hall",
      visual: h.visual || {},
    }));
    const LANDMARKS = (catalog.landmarks || []).filter((l) => l.id !== "campfire").map((l) => ({
      id: l.id,
      type: l.type || "landmark",
      name: l.name || l.id,
      emoji: l.emoji || "✦",
      x: l.x ?? 0,
      y: l.y ?? 0,
      color: campWorld.parseColorNumber(l.visual?.primary, 0x666666),
      roof: campWorld.parseColorNumber(l.visual?.roof, 0x444444),
      use: l.use || `You visit ${l.name || l.id}.`,
      visual: l.visual || {},
    }));
    // Base cast on field; heaven / grok wait for summon buttons
    const ALL_AGENT_DEFS = (catalog.agents || []).map((a) => ({
      id: a.id,
      name: a.name || a.id,
      color: campWorld.parseColorNumber(a.visual?.primary, 0xaaaaaa),
      accent: campWorld.parseColorNumber(a.visual?.accent, 0xffffff),
      x: a.x ?? 0,
      y: a.y ?? 0,
      visual: a.visual || {},
      base: a.base !== false && !a.summon,
      summon: a.summon || "",
      mood: a.mood || "neutral",
    }));
    let AGENTS = ALL_AGENT_DEFS.filter((a) => a.base || !a.summon);

    function toWorld(x, y) {
      return new THREE.Vector3(x * SCALE, 0, y * SCALE);
    }

    statusEl.textContent = "Building meadow…";

    // Mood/prop look tables MUST exist before makeAgent → applyLook (const TDZ bug froze boot)
    const MOOD_TINT = {
      happy: 0xfbbf24, love: 0xf472b6, think: 0xa78bfa, alert: 0x38bdf8,
      flirt: 0xfb7185, neutral: 0x94a3b8, afraid: 0x64748b, urgent: 0xf97316,
    };
    const PROP_LOOK = {
      beer: { tint: 0xf59e0b, glow: 0.45, scaleY: 1.06, mood: "happy" },
      steaks: { tint: 0xdc2626, glow: 0.5, scaleX: 1.08, mood: "happy" },
      herbs: { tint: 0x4ade80, glow: 0.35, scaleY: 0.96, mood: "love" },
      weed: { tint: 0x22c55e, glow: 0.4, scaleY: 0.92, mood: "think" },
      cookies: { tint: 0xd4a05a, glow: 0.35, scaleX: 1.05, mood: "happy" },
      ouija: { tint: 0xa855f7, glow: 0.55, scaleY: 1.04, mood: "think" },
      stereo: { tint: 0x38bdf8, glow: 0.5, scaleX: 1.06, mood: "flirt" },
      water: { tint: 0x38bdf8, glow: 0.3, scaleY: 1.0, mood: "neutral" },
      snacks: { tint: 0xfbbf24, glow: 0.4, scaleX: 1.05, mood: "happy" },
      fruit: { tint: 0xef4444, glow: 0.35, scaleY: 1.02, mood: "love" },
      wine: { tint: 0x9f1239, glow: 0.45, scaleY: 1.05, mood: "flirt" },
      marshmallows: { tint: 0xfef3c7, glow: 0.35, scaleX: 1.04, mood: "love" },
      tea: { tint: 0x86efac, glow: 0.3, scaleY: 0.98, mood: "think" },
      bread: { tint: 0xd6a06a, glow: 0.25, scaleX: 1.03, mood: "love" },
      cooler2: { tint: 0x0ea5e9, glow: 0.4, scaleY: 1.04, mood: "happy" },
    };

    // ── Scene ──
    const host = document.getElementById("canvas-host");
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x0a1628, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    // Sky dome (large open world)
    {
      const skyGeo = new THREE.SphereGeometry(280, 32, 24);
      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          topColor: { value: new THREE.Color(0x0c1a3a) },
          midColor: { value: new THREE.Color(0x1e1b4b) },
          bottomColor: { value: new THREE.Color(0x0f172a) },
          aurora: { value: new THREE.Color(0x34d399) },
          aurora2: { value: new THREE.Color(0x818cf8) },
        },
        vertexShader: `
          varying vec3 vPos;
          void main() {
            vPos = position;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 midColor;
          uniform vec3 bottomColor;
          uniform vec3 aurora;
          uniform vec3 aurora2;
          varying vec3 vPos;
          void main() {
            float h = normalize(vPos).y * 0.5 + 0.5;
            vec3 col = mix(bottomColor, midColor, smoothstep(0.0, 0.45, h));
            col = mix(col, topColor, smoothstep(0.4, 1.0, h));
            float band = sin(vPos.x * 0.03 + vPos.z * 0.02) * 0.5 + 0.5;
            float a = smoothstep(0.15, 0.55, h) * smoothstep(0.85, 0.4, h) * band;
            col = mix(col, mix(aurora, aurora2, band), a * 0.55);
            // stars
            float stars = step(0.997, fract(sin(dot(normalize(vPos).xz * 40.0, vec2(12.9898,78.233))) * 43758.5453));
            col += stars * smoothstep(0.35, 1.0, h) * 0.9;
            gl_FragColor = vec4(col, 1.0);
          }
        `,
      });
      scene.add(new THREE.Mesh(skyGeo, skyMat));

    // Distant mountain silhouettes (simple, cheap depth)

        const peak = new THREE.Mesh(
          new THREE.ConeGeometry(8 + (i % 4) * 2.5, 10 + (i % 5) * 3, 5),

        scene.add(peak);

    // Ground
    {
      const g = new THREE.CircleGeometry(95, 96);
      const pos = g.attributes.position;
      const colors = [];
      const c1 = new THREE.Color(0x14532d);
      const c2 = new THREE.Color(0x166534);
      const c3 = new THREE.Color(0x0f3d24);
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getY(i); // CircleGeometry in XY then rotate
        const n = Math.sin(x * 0.35) * Math.cos(z * 0.28) * 0.5 + 0.5;
        const c = c1.clone().lerp(c2, n).lerp(c3, Math.abs(Math.sin(x * 0.1 + z * 0.1)) * 0.3);
        colors.push(c.r, c.g, c.b);
      }
      g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.92,
        metalness: 0.02,
      });

      mesh.rotation.x = -Math.PI / 2;

    // Soft grass blades (instanced)

      const mat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.85 });
      const count = 900;
      const mesh = new THREE.InstancedMesh(blade, mat, count);
      const dummy = new THREE.Object3D();
      let n = 0;
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 2.2 + Math.random() * 22;
        if (r < 3.5) continue;
        dummy.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
        dummy.rotation.y = Math.random() * Math.PI;
        dummy.scale.setScalar(0.6 + Math.random() * 0.9);
        dummy.updateMatrix();
        mesh.setMatrixAt(n++, dummy.matrix);
      }
      mesh.count = n;
      mesh.castShadow = true;
      scene.add(mesh);
    }

    // Simple trees
    function makeTree(x, z, h = 1) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15 * h, 0.2 * h, 1.2 * h, 6),

    for (let i = 0; i < 36; i++) {

    // Houses

    for (const h of HOUSES) {

    // Landmarks (shop, TV, club, pond, shelter) — 2D parity structures
    const landmarkMeshes = [];

    // Props
    function makeLabelSprite(text, emoji, color) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, 256, 128);
      ctx.fillStyle = "rgba(8,14,28,0.82)";
      roundRect(ctx, 16, 24, 224, 80, 16);
      ctx.fill();
      ctx.font = "48px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(emoji, 128, 78);
      ctx.font = "bold 18px system-ui, sans-serif";
      ctx.fillStyle = "#e2e8f0";
      ctx.fillText(text, 128, 100);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: true });
      const spr = new THREE.Sprite(mat);
      spr.scale.set(1.6, 0.8, 1);
      return spr;
    }
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    /** Build a readable camp object (not a mystery cube). */
    function buildPropVisual(prop) {
      const g = new THREE.Group();

        add(new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.75, 0.75), mat(col, 0.4, 0.35, 0.12)), 0.4);
        add(new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.12, 0.8), mat(0x1e293b, 0.5, 0.2, 0)), 0.82);

      } else if (kit === "wine" || prop.id === "wine") {
        add(new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.45, 0.55), mat(0x44403c, 0.7, 0.05, 0)), 0.28);
        for (let i = 0; i < 3; i++) {
          const bot = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.55, 8), mat(col, 0.3, 0.2, 0.2));
          bot.position.set(-0.22 + i * 0.22, 0.7, 0);
          g.add(bot);
        }
      } else if (kit === "smores" || prop.id === "marshmallows") {
        add(new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.25, 0.5), mat(0xfef3c7, 0.6, 0, 0.1)), 0.25);
        add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 0.35), mat(0x78350f, 0.7, 0, 0)), 0.42);
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), mat(0xfffbeb, 0.5, 0, 0.1));
        m.position.set(0, 0.55, 0);
        g.add(m);
      } else if (kit === "kettle" || prop.id === "tea") {
        add(new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), mat(col, 0.35, 0.35, 0.15)), 0.45);
        add(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.2, 8), mat(0x166534, 0.4, 0.2, 0.1)), 0.75);
        const spout = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.28, 6), mat(col, 0.35, 0.3, 0.1));
        spout.rotation.z = Math.PI / 3;
        spout.position.set(0.28, 0.5, 0);
        g.add(spout);
      } else if (kit === "bread" || prop.id === "bread") {
        add(new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.28, 0.4), mat(col, 0.7, 0, 0.08)), 0.35);
        add(new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.12, 0.55), mat(0x57534e, 0.8, 0, 0)), 0.15);
      } else if (kit === "bundle" || prop.id === "herbs") {
        for (let i = 0; i < 5; i++) {
          const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.7, 5), mat(0x4ade80, 0.6, 0, 0.2));
          stalk.position.set((i - 2) * 0.08, 0.4, (i % 2) * 0.05);
          stalk.rotation.z = (i - 2) * 0.08;
          g.add(stalk);
        }
        add(new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.12, 0.3), mat(0x365314, 0.7, 0, 0.05)), 0.12);
      } else {
        add(new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.55, 0.75), mat(col, 0.5, 0.15, 0.12)), 0.35);
      }
      return g;
    }

    const propMeshes = [];
    function spawnProp(prop) {
      const p = toWorld(prop.x, prop.y);
      const group = buildPropVisual(prop);
      const label = makeLabelSprite(prop.name, prop.emoji, prop.color);
      label.position.y = 1.55;
      label.scale.set(2.0, 1.0, 1);
      group.add(label);
      // ground glow ring so you can spot it
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.55, 0.75, 24),
        new THREE.MeshBasicMaterial({ color: prop.color, transparent: true, opacity: 0.45, side: THREE.DoubleSide }),
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.03;
      group.add(ring);
      group.position.copy(p);
      group.userData = { kind: "prop", ...prop };
      scene.add(group);
      propMeshes.push(group);
      return group;
    }
    for (const prop of PROPS) spawnProp(prop);
    console.info("[camp3d] spawned props", propMeshes.length, PROPS.map((p) => p.id).join(","));
    // Big toast so you know objects loaded (not empty catalog)
    setTimeout(() => {
      try {
        showToast?.(`📦 ${propMeshes.length} camp objects · ${catalogSource}`);
      } catch (_) {}
    }, 900);

    // ── Personality from mood + archetype (drives sit / rest / roam / social) ──
    function buildPersonality(def) {
      const arch = String(def.visual?.archetype || def.visual?.kit || "").toLowerCase();
      const mood = String(def.mood || "neutral").toLowerCase();
      // baselines 0..1
      let energy = 0.5, rest = 0.4, social = 0.45, curiosity = 0.5, firelove = 0.4, pace = 1;
      const archMap = {
        messenger: { energy: 0.9, rest: 0.15, social: 0.55, curiosity: 0.7, pace: 1.25 },
        seer: { energy: 0.3, rest: 0.75, social: 0.35, curiosity: 0.85, firelove: 0.5, pace: 0.75 },
        healer: { energy: 0.35, rest: 0.65, social: 0.5, curiosity: 0.45, firelove: 0.55, pace: 0.8 },
        guardian: { energy: 0.7, rest: 0.25, social: 0.3, curiosity: 0.4, firelove: 0.35, pace: 1.1 },
        shepherd: { energy: 0.35, rest: 0.7, social: 0.6, curiosity: 0.4, firelove: 0.7, pace: 0.7 },
        reveler: { energy: 0.75, rest: 0.25, social: 0.9, curiosity: 0.5, firelove: 0.55, pace: 1.15 },
        lights: { energy: 0.6, rest: 0.35, social: 0.7, curiosity: 0.65, firelove: 0.4, pace: 1.05 },
        allfather: { energy: 0.4, rest: 0.6, social: 0.4, curiosity: 0.7, firelove: 0.65, pace: 0.75 },
        thunder: { energy: 0.95, rest: 0.1, social: 0.55, curiosity: 0.45, firelove: 0.3, pace: 1.35 },
        moon_host: { energy: 0.5, rest: 0.55, social: 0.65, curiosity: 0.55, firelove: 0.8, pace: 0.9 },
      };
      const am = archMap[arch];
      if (am) {
        energy = am.energy ?? energy;
        rest = am.rest ?? rest;
        social = am.social ?? social;
        curiosity = am.curiosity ?? curiosity;
        firelove = am.firelove ?? firelove;
        pace = am.pace ?? pace;
      }
      const moodMap = {
        happy: { energy: 0.12, social: 0.1, rest: -0.05 },
        love: { rest: 0.15, social: 0.12, firelove: 0.1, energy: -0.08 },
        think: { rest: 0.2, curiosity: 0.15, energy: -0.15, social: -0.05 },
        alert: { energy: 0.2, rest: -0.2, social: -0.1 },
        flirt: { social: 0.2, energy: 0.08, rest: -0.05 },
        neutral: {},
        afraid: { rest: 0.1, energy: -0.1, social: -0.15 },
      };
      const mm = moodMap[mood] || {};
      energy = THREE.MathUtils.clamp(energy + (mm.energy || 0) + (Math.random() - 0.5) * 0.08, 0.08, 0.98);
      rest = THREE.MathUtils.clamp(rest + (mm.rest || 0) + (Math.random() - 0.5) * 0.08, 0.05, 0.95);
      social = THREE.MathUtils.clamp(social + (mm.social || 0) + (Math.random() - 0.5) * 0.08, 0.05, 0.95);
      curiosity = THREE.MathUtils.clamp(curiosity + (mm.curiosity || 0), 0.1, 0.95);
      firelove = THREE.MathUtils.clamp(firelove + (mm.firelove || 0), 0.1, 0.95);
      return { energy, rest, social, curiosity, firelove, pace, mood, arch };
    }

    // Chairs / seats from catalog
    const SEATS = (catalog.furniture || []).filter((f) => f.kind === "seat" || f.kind === "chair");
    const seatMeshes = [];
    const seatState = []; // { id, pos, occupiedBy }
    function spawnSeat(seat) {
      const p = toWorld(seat.x ?? 0, seat.y ?? 0);
      const group = new THREE.Group();
      const col = campWorld.parseColorNumber(seat.visual?.primary, 0x5c4033);
      const legMat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.85 });
      // seat plate
      const plate = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.1, 0.55), legMat);
      plate.position.y = 0.42;
      plate.castShadow = true;
      group.add(plate);
      // four stub legs
      for (const [lx, lz] of [[-0.18, -0.18], [0.18, -0.18], [-0.18, 0.18], [0.18, 0.18]]) {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.42, 6), legMat);
        leg.position.set(lx, 0.21, lz);
        group.add(leg);
      }
      // backrest
      const back = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.45, 0.08), legMat);
      back.position.set(0, 0.7, -0.22);
      group.add(back);
      const label = makeLabelSprite(seat.name || "Seat", seat.emoji || "🪑", col);
      label.position.y = 1.15;
      label.scale.set(1.2, 0.6, 1);
      group.add(label);
      group.position.copy(p);
      // face roughly toward fire
      group.lookAt(0, group.position.y, 0);
      group.userData = { kind: "seat", id: seat.id, name: seat.name };
      scene.add(group);
      seatMeshes.push(group);
      const rec = { id: seat.id, pos: p.clone(), mesh: group, occupiedBy: null };
      seatState.push(rec);
      return rec;
    }
    for (const s of SEATS) spawnSeat(s);

    // Agents — mood/personality free will
    const agentState = [];
    const roamPoints = [];
    let aiInFlight = 0;
    const AI_MAX = 1; // chill: one AI monologue at a time
    /** Mythic / winged agents may take off and roam the air */
    const FLYER_IDS = new Set([
      "hermes", "seraph", "zeus", "luna", "aurora", "violet",
      "michael", "gabriel", "uriel", "ara", "mika",
    ]);
    function makeAgent(def) {
      const group = new THREE.Group();
      // Placeholder capsule until free GLB character loads
      const bodyMat = new THREE.MeshStandardMaterial({
        color: def.color,
        roughness: 0.4,
        metalness: 0.1,
        emissive: def.color,
        emissiveIntensity: 0.22,
      });
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 0.75, 6, 12), bodyMat);
      body.position.y = 0.9;
      body.castShadow = true;
      body.name = "body";
      group.add(body);
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.24, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xffe4c8, roughness: 0.55 }),
      );
      head.position.y = 1.62;
      head.castShadow = true;
      head.name = "head";
      group.add(head);
      const feet = new THREE.Mesh(
        new THREE.CircleGeometry(0.28, 16),
        new THREE.MeshBasicMaterial({ color: def.color, transparent: true, opacity: 0.35 }),
      );
      feet.rotation.x = -Math.PI / 2;
      feet.position.y = 0.02;
      feet.name = "feet";
      group.add(feet);
      const label = makeLabelSprite(def.name, "✦", def.color);
      label.position.y = 2.35;
      label.scale.set(1.6, 0.8, 1);
      label.name = "label";
      group.add(label);
      const p = toWorld(def.x, def.y);
      group.position.copy(p);
      group.userData = { kind: "agent", id: def.id, name: def.name };
      scene.add(group);
      const persona = buildPersonality(def);
      const canFly = FLYER_IDS.has(def.id);
      const st = {
        def,
        mesh: group,
        body,
        head,
        target: p.clone(),
        home: p.clone(),
        speakUntil: 0,
        phase: Math.random() * Math.PI * 2,
        speed: (3.4 + Math.random() * 2.2) * persona.pace,
        // Soft physics state
        vx: 0,
        vz: 0,
        vy: 0,
        canFly,
        flying: false,
        flyHeight: canFly ? 0.4 + Math.random() * 0.8 : 0,
        nextDecideAt: performance.now() + 800 + Math.random() * 4000,
        moving: false,
        posture: "stand",
        seatId: null,
        persona,
        energyNow: persona.energy,
        boredom: Math.random() * 0.3,
        char: null, // free GLB character once loaded
        animState: "idle",
      };
      agentState.push(st);
      applyLook(st);
      // GLB characters load AFTER camp is playable (never block "Building meadow")
      st._upgradeChar = () => {
        if (!charSystem || st.char) return Promise.resolve();
        return charSystem.createCharacter(def, def.color).then((ch) => {
          if (!ch || !st.mesh) return;
          body.visible = false;
          head.visible = false;
          if (feet) feet.visible = false;
          st.mesh.add(ch.root);
          st.char = ch;
          ch.setTint(def.color, 0.12);
          label.position.y = 2.1;
          applyLook(st);
        }).catch((e) => console.warn("char load", def.id, e));
      };
      return st;
    }
    for (const a of AGENTS) makeAgent(a);

    // Roam anchors
    roamPoints.push(new THREE.Vector3(0, 0, 0));
    for (const p of PROPS) roamPoints.push(toWorld(p.x, p.y));
    for (const h of HOUSES) roamPoints.push(toWorld(h.x, h.y).add(new THREE.Vector3(0, 0, 1.2)));
    for (const lm of LANDMARKS) roamPoints.push(toWorld(lm.x, lm.y));
    for (const s of seatState) roamPoints.push(s.pos.clone());
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const r = 4 + (i % 3) * 3;
      roamPoints.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
    }

    function freeSeat(st) {
      if (st.seatId) {
        const seat = seatState.find((s) => s.id === st.seatId);
        if (seat && seat.occupiedBy === st.def.id) seat.occupiedBy = null;
        st.seatId = null;
      }
      st.posture = "stand";
      applyPosture(st);
    }

    function applyPosture(st) {
      const body = st.body;
      const head = st.head;
      const feet = st.mesh.getObjectByName("feet");
      const label = st.mesh.getObjectByName("label");
      const look = st.look || {};
      const sx = look.scaleX || 1;
      const sy = look.scaleY || 1;
      if (st.posture === "sit") {
        if (body) {
          body.position.y = 0.55;
          body.scale.set(sx, 0.72 * sy, sx);
          body.rotation.x = 0.35;
        }
        if (head) head.position.y = 1.15;
        if (feet) feet.visible = false;
        if (label) label.position.y = 1.75;
      } else {
        if (body) {
          body.position.y = 0.9;
          body.scale.set(sx, sy, sx);
          body.rotation.x = 0;
        }
        if (head) head.position.y = 1.62;
        if (feet) feet.visible = true;
        if (label) label.position.y = 2.25;
      }
      applyLook(st);
    }

    function applyLook(st) {
      const base = new THREE.Color(st.def.color);
      const moodC = new THREE.Color(MOOD_TINT[st.persona.mood] || st.def.color);
      const look = st.look || {};
      const propC = look.tint != null ? new THREE.Color(look.tint) : base;
      const c = base.clone().lerp(moodC, 0.35).lerp(propC, look.tint != null ? 0.4 : 0);
      const glow = look.glow != null ? look.glow : (st.posture === "sit" ? 0.2 : 0.28);
      // Free GLB character tint
      if (st.char?.setTint) {
        st.char.setTint(c.getHex(), glow);
        if (st.char.root) {
          const sx = look.scaleX || 1;
          const sy = look.scaleY || 1;
          st.char.root.scale.set(sx, st.posture === "sit" ? sy * 0.85 : sy, sx);
          st.char.root.position.y = st.posture === "sit" ? -0.35 : 0;
        }
        return;
      }
      if (!st.body?.material) return;
      st.body.material.color.copy(c);
      st.body.material.emissive.copy(c);
      st.body.material.emissiveIntensity = glow;
      const sx = look.scaleX || 1;
      const sy = look.scaleY || 1;
      if (st.posture !== "sit") st.body.scale.set(sx, sy, sx);
      else st.body.scale.set(sx, 0.72 * sy, sx);
      if (st.head?.material) {
        st.head.material.emissive.copy(moodC);
        st.head.material.emissiveIntensity = st.speakUntil > performance.now() ? 0.25 : 0.05;
      }
    }

    function shiftFromProp(st, propId) {
      const fx = PROP_LOOK[propId] || { tint: st.def.color, glow: 0.3 };
      st.look = { ...fx };
      st.lastProp = propId;
      if (fx.mood) {
        st.persona.mood = fx.mood;
        st.def.mood = fx.mood;
      }
      // stat nudges
      if (propId === "weed" || propId === "herbs") {
        st.persona.rest = Math.min(0.95, st.persona.rest + 0.08);
        st.energyNow = Math.max(0.15, st.energyNow - 0.1);
      } else if (propId === "beer" || propId === "wine") {
        st.persona.social = Math.min(0.95, st.persona.social + 0.1);
        st.energyNow = Math.min(1, st.energyNow + 0.05);
      } else if (propId === "steaks" || propId === "snacks" || propId === "cookies" || propId === "bread") {
        st.energyNow = Math.min(1, st.energyNow + 0.12);
        st.persona.energy = Math.min(0.95, st.persona.energy + 0.05);
      } else if (propId === "stereo") {
        st.persona.social = Math.min(0.95, st.persona.social + 0.08);
        st.persona.energy = Math.min(0.95, st.persona.energy + 0.06);
      } else if (propId === "ouija") {
        st.persona.curiosity = Math.min(0.95, st.persona.curiosity + 0.1);
        st.persona.mood = "think";
      } else if (propId === "tea" || propId === "water") {
        st.persona.rest = Math.min(0.95, st.persona.rest + 0.05);
      }
      applyLook(st);
      applyPosture(st);
    }

    /** Agent arrived at a prop — use it, change look, speak a fresh take (AI). */
    async function agentUseProp(st) {
      const propId = st.propTarget;
      if (!propId || st.propUsedAt === propId && performance.now() - (st.propUsedTime || 0) < 8000) return;
      st.propUsedAt = propId;
      st.propUsedTime = performance.now();
      const prop = PROPS.find((p) => p.id === propId);
      const pname = prop?.name || propId;
      shiftFromProp(st, propId);
      logLine(st.def.name, `uses ${pname}`);
      showToast(`${prop?.emoji || "✦"} ${st.def.name} → ${pname}`);
      // Optional server memory
      try {
        campClient.useProp(propId, { agentId: st.def.id, speak: false }).catch(() => {});
      } catch (_) {}
      // Their own take — may "change mind" mid-sentence vibe via prompt
      if (aiInFlight < AI_MAX) {
        aiInFlight++;
        try {
          const data = await campClient.agentChat(
            st.def.id,
            `You (${st.def.name}) just used ${pname} at camp. Mood now: ${st.persona.mood}. ` +
            `In 2–4 sentences in character: what you wanted to say, then how ${pname} changed your take. ` +
            `Witty, present, no meta, no "as an AI".`,
            { ambient: true },
          );
          const reply = String(data.reply || data.text || "").trim();
          if (reply) {
            showSpeech3d(st.def.id, reply, speechReadMs(reply));
            logLine(st.def.name, reply);
          }
        } catch (_) {
          showSpeech3d(st.def.id, `${pname} hits different tonight.`, 22000);
        } finally {
          aiInFlight = Math.max(0, aiInFlight - 1);
        }
      }
    }

    function findFreeSeat(preferNear = null) {
      const free = seatState.filter((s) => !s.occupiedBy);
      if (!free.length) return null;
      if (preferNear) {
        free.sort((a, b) => a.pos.distanceTo(preferNear) - b.pos.distanceTo(preferNear));
        return free[0];
      }
      return free[Math.floor(Math.random() * free.length)];
    }

    function pickRoamTarget(st, opts = {}) {
      freeSeat(st);
      let tx = st.mesh.position.x;
      let tz = st.mesh.position.z;
      let tries = 0;
      const maxR = 4 + st.persona.energy * 14;
      const wantFly = !!(opts.fly || (st.canFly && opts.allowFly !== false && Math.random() < 0.55));
      do {
        const roll = Math.random();
        if (roll < 0.35 && roamPoints.length) {
          const p = roamPoints[Math.floor(Math.random() * roamPoints.length)];
          tx = p.x + (Math.random() - 0.5) * 3.2;
          tz = p.z + (Math.random() - 0.5) * 3.2;
        } else if (roll < 0.62) {
          const a = Math.random() * Math.PI * 2;
          const r = 2.5 + Math.random() * maxR;
          tx = st.home.x + Math.cos(a) * r;
          tz = st.home.z + Math.sin(a) * r;
        } else if (agentState.length > 1 && roll < 0.85) {
          const other = agentState[Math.floor(Math.random() * agentState.length)];
          tx = other.mesh.position.x + (Math.random() - 0.5) * 3.5;
          tz = other.mesh.position.z + (Math.random() - 0.5) * 3.5;
        } else {
          // Freer “go where I want” long hop
          const a = Math.random() * Math.PI * 2;
          const r = 5 + Math.random() * (wantFly ? 14 : 10);
          tx = Math.cos(a) * r;
          tz = Math.sin(a) * r;
        }
        tries++;
      } while (tries < 8 && Math.hypot(tx - st.mesh.position.x, tz - st.mesh.position.z) < 2.2);
      // Clamp to meadow radius ~22
      const dist0 = Math.hypot(tx, tz);
      if (dist0 > 22) {
        tx = (tx / dist0) * 22;
        tz = (tz / dist0) * 22;
      }
      const ty = wantFly ? (1.1 + Math.random() * 2.4) : 0;
      st.target.set(tx, ty, tz);
      st.flying = wantFly;
      st.flyHeight = wantFly ? ty : 0;
      st.moving = true;
      st.action = wantFly ? "fly" : "wander";
      st.posture = "stand";
    }

    function goSit(st, seat) {
      if (!seat) return false;
      freeSeat(st);
      seat.occupiedBy = st.def.id;
      st.seatId = seat.id;
      st.target.copy(seat.pos);
      st.moving = true;
      st.action = "go_sit";
      st.pendingSit = true;
      return true;
    }

    function arriveSit(st) {
      st.posture = "sit";
      st.moving = false;
      st.pendingSit = false;
      st.action = "sit";
      applyPosture(st);
      // face outward a bit
      if (st.seatId) {
        const seat = seatState.find((s) => s.id === st.seatId);
        if (seat?.mesh) st.mesh.rotation.y = seat.mesh.rotation.y + Math.PI;
      }
      // rest longer if high rest trait
      const sitMs = 8000 + st.persona.rest * 18000 + Math.random() * 6000;
      st.nextDecideAt = performance.now() + sitMs;
      st.energyNow = Math.min(1, st.energyNow + 0.12);
      st.boredom = Math.max(0, st.boredom - 0.15);
    }

    /**
     * Mood/personality-weighted free will — NOT forced marching.
     * Actions: sit | idle | wander | social | fire | prop | house
     */
    function decideAction(st) {
      const p = st.persona;
      // drift stats
      st.boredom = Math.min(1, st.boredom + 0.04 + (1 - p.rest) * 0.03);
      st.energyNow = THREE.MathUtils.clamp(
        st.energyNow + (Math.random() - 0.45) * 0.06 - (st.posture === "sit" ? -0.02 : 0.02),
        0.1,
        1,
      );

      // weights
      const wSit = p.rest * 1.4 + (1 - st.energyNow) * 0.8 + (p.mood === "think" || p.mood === "love" ? 0.35 : 0);
      const wIdle = p.rest * 0.6 + (st.posture === "sit" ? 0.5 : 0.2);
      const wWander = p.energy * 1.1 + st.boredom * 0.7 + st.energyNow * 0.4;
      const wSocial = p.social * 1.2 + (p.mood === "flirt" || p.mood === "happy" ? 0.3 : 0);
      const wFire = p.firelove * 1.1;
      // Props are a big part of camp life — bias toward interacting
      const wProp = p.curiosity * 1.35 + 0.35 + (st.boredom > 0.4 ? 0.25 : 0);
      const wHouse = (p.rest * 0.4 + p.curiosity * 0.3) * (Math.random() > 0.5 ? 1 : 0.6);
      const wFly = st.canFly
        ? (p.energy * 1.25 + st.boredom * 0.55 + 0.45 + (p.mood === "happy" || p.mood === "flirt" ? 0.25 : 0))
        : 0;

      // if already sitting and still comfy, often stay
      if (st.posture === "sit" && Math.random() < p.rest * 0.7 && st.boredom < 0.55) {
        st.nextDecideAt = performance.now() + 12000 + p.rest * 14000;
        st.action = "sit";
        return "sit";
      }

      const bag = [
        ["sit", wSit],
        ["idle", wIdle],
        ["wander", wWander],
        ["fly", wFly],
        ["social", wSocial],
        ["fire", wFire],
        ["prop", wProp],
        ["house", wHouse],
      ];
      const total = bag.reduce((s, [, w]) => s + Math.max(0.01, w), 0);
      let r = Math.random() * total;
      let choice = "idle";
      for (const [name, w] of bag) {
        r -= Math.max(0.01, w);
        if (r <= 0) { choice = name; break; }
      }

      freeSeat(st);

      if (choice === "sit") {
        const seat = findFreeSeat(st.mesh.position);
        if (seat && goSit(st, seat)) {
          st.nextDecideAt = performance.now() + 14000 + p.rest * 16000;
          return "go_sit";
        }
        choice = "idle";
      }
      if (choice === "idle") {
        st.moving = false;
        st.flying = false;
        st.target.copy(st.mesh.position);
        st.target.y = 0;
        st.action = "idle";
        st.nextDecideAt = performance.now() + 10000 + p.rest * 14000 + Math.random() * 6000;
        return "idle";
      }
      if (choice === "fly" && st.canFly) {
        pickRoamTarget(st, { fly: true });
        st.nextDecideAt = performance.now() + 14000 + Math.random() * 12000;
        return "fly";
      }
      if (choice === "social" && agentState.length > 1) {
        const other = agentState.filter((s) => s !== st && s.posture !== "sit")[Math.floor(Math.random() * Math.max(1, agentState.length - 1))]
          || agentState.find((s) => s !== st);
        if (other) {
          const air = st.canFly && Math.random() < 0.4;
          st.target.set(
            other.mesh.position.x + (Math.random() - 0.5) * 1.8,
            air ? (1.2 + Math.random() * 1.6) : 0,
            other.mesh.position.z + (Math.random() - 0.5) * 1.8,
          );
          st.flying = air;
          st.moving = true;
          st.action = air ? "fly" : "social";
          st.socialTarget = other.def.id;
          st.nextDecideAt = performance.now() + 14000 + Math.random() * 10000;
          return st.action;
        }
      }
      if (choice === "fire") {
        const a = Math.random() * Math.PI * 2;
        const r = 2.2 + Math.random() * 2.5;
        st.target.set(Math.cos(a) * r, 0, Math.sin(a) * r);
        st.moving = true;
        st.action = "fire";
        // maybe sit at fire ring after
        st.wantSitAfter = Math.random() < p.rest * 0.8;
        st.nextDecideAt = performance.now() + 16000 + Math.random() * 8000;
        return "fire";
      }
      if (choice === "prop" && PROPS.length) {
        // Prefer a prop they haven't used recently
        const shuffled = PROPS.slice().sort(() => Math.random() - 0.5);
        const prop = shuffled.find((pr) => pr.id !== st.lastProp) || shuffled[0];
        const w = toWorld(prop.x, prop.y);
        st.target.set(w.x, 0, w.z);
        st.moving = true;
        st.action = "prop";
        st.propTarget = prop.id;
        st.pendingProp = true;
        st.nextDecideAt = performance.now() + 18000 + Math.random() * 10000;
        return "prop";
      }
      if (choice === "house" && HOUSES.length) {
        // prefer own house if high rest
        let house = HOUSES.find((h) => h.id === st.def.id);
        if (!house || Math.random() > p.rest * 0.7) house = HOUSES[Math.floor(Math.random() * HOUSES.length)];
        const w = toWorld(house.x, house.y);
        st.target.set(w.x + (Math.random() - 0.5), 0, w.z + 1);
        st.moving = true;
        st.action = "house";
        st.nextDecideAt = performance.now() + 16000 + Math.random() * 10000;
        return "house";
      }
      // wander fallback
      pickRoamTarget(st);
      st.nextDecideAt = performance.now() + 12000 + (1 - p.energy) * 10000 + Math.random() * 8000;
      return "wander";
    }

    function scatterAll() {
      // Soft nudge — high-energy types walk; restful types may sit
      let walked = 0, sat = 0;
      for (const st of agentState) {
        if (st.persona.energy > 0.55 || Math.random() < st.persona.energy) {
          pickRoamTarget(st);
          walked++;
        } else {
          const seat = findFreeSeat(st.mesh.position);
          if (seat && goSit(st, seat)) sat++;
          else {
            st.moving = false;
            st.action = "idle";
          }
        }
        st.nextDecideAt = performance.now() + 8000 + Math.random() * 12000;
      }
      showToast(`🌿 free will · ${walked} stroll · ${sat} sit`);
      logLine("Camp", `Mood wave — ${walked} walking, ${sat} claiming chairs (not forced).`);
    }

    // Visitor (you) + ground click marker
    const visitor = new THREE.Group();
    {
      const mat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0ea5e9, emissiveIntensity: 0.35 });
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.7, 6, 12), mat);
      body.position.y = 0.85;
      body.castShadow = true;
      visitor.add(body);
      const label = makeLabelSprite("You", "★", 0x38bdf8);
      label.position.y = 2.0;
      label.scale.set(1.3, 0.65, 1);
      visitor.add(label);
      visitor.position.set(2.5, 0, 4);
      scene.add(visitor);
    }
    const visitorTarget = visitor.position.clone();
    const groundMarker = new THREE.Mesh(
      new THREE.RingGeometry(0.25, 0.4, 32),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.85, side: THREE.DoubleSide }),
    );
    groundMarker.rotation.x = -Math.PI / 2;
    groundMarker.position.y = 0.05;
    groundMarker.visible = false;
    scene.add(groundMarker);

    // Ground plane for click-to-move (invisible, large)
    const FIELD = 72; // open meadow half-size (meadow units → world already large)
    const walkPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshBasicMaterial({ visible: false }),
    );
    walkPlane.rotation.x = -Math.PI / 2;
    walkPlane.position.y = 0.01;
    scene.add(walkPlane);

    const keys = { w: false, a: false, s: false, d: false };

    refreshWhoSelect();
    whoEl.value = "luna";

    // 3D has no full chat panel — still write shared dialogue tape for 2D continuity
    function logLine(who, text, _you = false) {
      const speaker = String(who || "Camp").trim();
      const clean = String(text || "").trim();
      if (!speaker || !clean) return;
      try {
        import(`/static/camp-bridge.mjs?v=301`)
          .then((mod) => {
            mod.pushDialogueTape?.({
              speaker,
              text: clean.slice(0, 480),
              mood: _you ? "you" : "neutral",
              scene: "luna-3d",
            });
          })
          .catch(() => {});
      } catch (_) {}
    }
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    const activeBubbles = [];
    let orbitPinnedForBubble = false;
    /** Agent id the visitor last FRONT-selected (any agent — not just Hermes). */
    let selectedSpeechAgentId = "";
    const LONG_PRESS_MS = 480; // phone-friendly hold to lock

    function setOrbitEnabled(on) {
      try {
        if (!controls) return;
        controls.enabled = !!on;
        controls.enableRotate = !!on;
        controls.enablePan = !!on;
        controls.enableZoom = !!on;
      } catch (_) {}
    }

    /**
     * All visible bubbles under (x,y) — sorted so the *closest center* wins.
     * (Old code always preferred highest z-index, so a FRONT Hermes box ate every click.)
     */
    function bubblesAtPoint(x, y) {
      const hits = [];
      const pad = 12;
      for (const b of activeBubbles) {
        const el = b.el;
        if (!el || el.style.display === "none" || el.hidden) continue;
        const r = el.getBoundingClientRect();
        if (r.width < 2 || r.height < 2) continue;
        if (
          x >= r.left - pad &&
          x <= r.right + pad &&
          y >= r.top - pad &&
          y <= r.bottom + pad
        ) {
          const cx = r.left + r.width / 2;
          const cy = r.top + r.height / 2;
          const dist = Math.hypot(x - cx, y - cy);
          hits.push({ b, dist, area: r.width * r.height, el });
        }
      }
      // Closest center first; if tie, prefer smaller (easier to pick a non-FRONT box)
      hits.sort((a, b) => a.dist - b.dist || a.area - b.area);
      return hits.map((h) => h.b);
    }

    let lastBubblePickAt = 0;
    let lastBubblePickEl = null;

    function bubbleFromPoint(x, y, { cycle = true } = {}) {
      const geom = bubblesAtPoint(x, y);
      if (geom.length) {
        // Prefer closest bubble; if same as current FRONT and another is under finger, cycle
        const top = geom[0];
        const now = performance.now();
        if (
          cycle &&
          geom.length > 1 &&
          now - lastBubblePickAt > 250 &&
          lastBubblePickEl === top.el &&
          top.el.classList.contains("front") &&
          !top.holdLocked
        ) {
          return geom[1].el;
        }
        return top.el;
      }
      // Nearest bubble within slop (fat finger) even if slightly outside rect
      let best = null;
      let bestD = 48;
      for (const b of activeBubbles) {
        const el = b.el;
        if (!el || el.style.display === "none") continue;
        const r = el.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        const d = Math.hypot(x - cx, y - cy);
        if (d < bestD) {
          bestD = d;
          best = el;
        }
      }
      if (best) return best;
      try {
        const stack = document.elementsFromPoint(x, y) || [];
        for (const node of stack) {
          if (!node || node.nodeType !== 1) continue;
          if (node.classList?.contains("bubble3d")) return node;
          const parent = node.closest?.(".bubble3d");
          if (parent) return parent;
        }
      } catch (_) {}
      return null;
    }

    function ensureFrontChip(el, locked) {
      if (!el) return;
      let chip = el.querySelector(".front-chip");
      if (!chip) {
        chip = document.createElement("span");
        chip.className = "front-chip";
        chip.setAttribute("aria-hidden", "true");
        el.appendChild(chip);
      }
      chip.textContent = locked ? "🔒 LOCK" : "FRONT";
    }

    function clearFrontChip(el) {
      el?.querySelector?.(".front-chip")?.remove();
    }

    /**
     * Pressed agent's box becomes FRONT — works for Luna, Hermes, Oracle, anyone.
     */
    function bringBubbleFront(el, opts = {}) {
      if (!el) return false;
      const target = activeBubbles.find((b) => b.el === el);
      if (!target) return false;

      selectedSpeechAgentId = target.agentId || "";
      // Talk-to menu follows whichever chat you picked (not stuck on Hermes)
      try {
        if (selectedSpeechAgentId && whoEl) {
          whoEl.value = selectedSpeechAgentId;
          const nm = target.el.querySelector?.(".who")?.textContent || selectedSpeechAgentId;
          if (msgEl) msgEl.placeholder = `Talk to ${nm}…`;
        }
      } catch (_) {}

      try {
        const layer = speechLayer || document.body;
        layer.appendChild(el); // last child = paints on top
      } catch (_) {}

      bubbleFrontZ = Math.min((bubbleFrontZ || 220) + 1, 980);
      const rank = target.holdLocked || opts.lock ? 990 : 850 + (bubbleFrontZ % 80);

      for (const b of activeBubbles) {
        const isFront = b.el === el;
        b.el.classList.toggle("front", isFront);
        b.el.classList.toggle("dimmed", !isFront && !b.holdLocked);
        b.el.setAttribute("aria-pressed", isFront ? "true" : "false");
        b.el.setAttribute("data-agent", b.agentId || "");
        b.el.style.pointerEvents = "auto";
        if (isFront) {
          b.stackRank = rank;
          b.frontPinned = true;
          if (!b.holdLocked) {
            b.until = Math.max(b.until, performance.now() + 120000);
          }
          b.el.style.setProperty("z-index", String(rank), "important");
          b.el.style.opacity = "1";
          b.el.style.filter = "none";
          ensureFrontChip(b.el, !!b.holdLocked);
          const st = agentState.find((a) => a.def.id === b.agentId);
          if (st) st.speakUntil = b.until;
        } else if (b.holdLocked) {
          b.stackRank = 700;
          b.el.style.setProperty("z-index", "700", "important");
          b.el.style.opacity = "1";
          b.el.style.filter = "none";
          b.el.classList.add("locked");
          ensureFrontChip(b.el, true);
        } else {
          // Keep other agents' chats visible + tappable (not buried under one Hermes box)
          b.stackRank = 300 + activeBubbles.indexOf(b);
          b.el.style.setProperty("z-index", String(b.stackRank), "important");
          b.frontPinned = false;
          clearFrontChip(b.el);
        }
      }

      try { el.focus({ preventScroll: true }); } catch (_) {}
      setOrbitEnabled(false);
      orbitPinnedForBubble = true;
      lastBubblePickAt = performance.now();
      lastBubblePickEl = el;

      if (!opts.quiet) {
        const who = el.querySelector?.(".who")?.textContent || target.agentId || "Speech";
        try {
          showToast(target.holdLocked ? `🔒 ${who} locked front` : `📌 ${who} FRONT`);
        } catch (_) {}
      }
      return true;
    }

    /** Bring a specific agent's open chat to front (if they have a bubble). */
    function bringAgentSpeechFront(agentId) {
      if (!agentId) return false;
      const item = activeBubbles.find((b) => b.agentId === agentId && b.el?.style.display !== "none");
      if (!item) return false;
      return bringBubbleFront(item.el);
    }

    function setBubbleHoldLock(el, locked) {
      const item = activeBubbles.find((b) => b.el === el);
      if (!item || !el) return false;
      item.holdLocked = !!locked;
      item.frontPinned = true;
      el.classList.toggle("locked", !!locked);
      el.setAttribute("data-locked", locked ? "1" : "0");
      if (locked) {
        item.until = Number.POSITIVE_INFINITY;
        try { navigator.vibrate?.(18); } catch (_) {}
        bringBubbleFront(el, { quiet: true, lock: true });
        const who = el.querySelector?.(".who")?.textContent || "Speech";
        showToast(`🔒 ${who} locked — hold again to unlock`);
      } else {
        item.until = performance.now() + 90000;
        el.classList.remove("locked");
        bringBubbleFront(el, { quiet: true });
        showToast("🔓 Unlocked");
        if (!activeBubbles.some((b) => b.holdLocked)) {
          /* keep front until meadow tap */
        }
      }
      return true;
    }

    function toggleBubbleHoldLock(el) {
      const item = activeBubbles.find((b) => b.el === el);
      if (!item) return false;
      return setBubbleHoldLock(el, !item.holdLocked);
    }

    function uiChromeBlocksPick(t) {
      if (!t || !t.closest) return false;
      if (t.closest?.(".bubble3d") || t.classList?.contains("bubble3d")) return false;
      return !!t.closest(
        "#dock, #topbar, #camp-feature-root, #mode-pill, #boot-error"
      );
    }

    /**
     * Press/select = FRONT immediately (like 2D). Hold ~0.5s = lock.
     */
    function bindBubbleSelect(el) {
      if (!el || el.__bubbleBound) return;
      el.__bubbleBound = true;
      let holdTimer = null;
      let holdFired = false;
      let startX = 0;
      let startY = 0;

      function clearHold() {
        if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
        el.classList.remove("holding");
      }

      function onDown(e) {
        if (e.button != null && e.button !== 0) return;
        if (e.pointerType === "touch" && e.isPrimary === false) return;
        e.preventDefault?.();
        e.stopPropagation?.();
        e.stopImmediatePropagation?.();
        setOrbitEnabled(false);
        // IMMEDIATE front on press (this was missing — only ran on pointerup before)
        bringBubbleFront(el);
        holdFired = false;
        startX = e.clientX ?? 0;
        startY = e.clientY ?? 0;
        el.classList.add("holding");
        try { el.setPointerCapture?.(e.pointerId); } catch (_) {}
        clearHold();
        holdTimer = setTimeout(() => {
          holdTimer = null;
          holdFired = true;
          el.classList.remove("holding");
          toggleBubbleHoldLock(el);
        }, LONG_PRESS_MS);
      }

      function onMove(e) {
        if (!holdTimer) return;
        if (Math.hypot((e.clientX ?? 0) - startX, (e.clientY ?? 0) - startY) > 16) clearHold();
      }

      function onUp(e) {
        clearHold();
        try { el.releasePointerCapture?.(e.pointerId); } catch (_) {}
        e.preventDefault?.();
        e.stopPropagation?.();
        // Front already applied on down; re-assert if not a lock toggle
        if (!holdFired) bringBubbleFront(el, { quiet: true });
      }

      el.addEventListener("pointerdown", onDown, { capture: true });
      el.addEventListener("pointermove", onMove, { capture: true });
      el.addEventListener("pointerup", onUp, { capture: true });
      el.addEventListener("pointercancel", clearHold, { capture: true });
      el.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        bringBubbleFront(el);
      }, { capture: true });
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          bringBubbleFront(el);
        }
      });
    }

    // Canvas / empty space: hit-test bubble geometry (when WebGL is under the finger)
    let geoHoldTimer = null;
    let geoHoldEl = null;
    let geoHoldFired = false;
    let geoStartX = 0;
    let geoStartY = 0;

    function clearGeoHold() {
      if (geoHoldTimer) { clearTimeout(geoHoldTimer); geoHoldTimer = null; }
      geoHoldEl?.classList?.remove("holding");
      geoHoldEl = null;
      geoHoldFired = false;
    }

    function onGlobalBubblePick(e) {
      if (e.button != null && e.button !== 0) return;
      if (e.target?.closest?.(".bubble3d")) return; // bubble handlers own it
      if (uiChromeBlocksPick(e.target)) return;

      const el = bubbleFromPoint(e.clientX, e.clientY, { cycle: false });
      if (el) {
        e.preventDefault?.();
        e.stopPropagation?.();
        e.stopImmediatePropagation?.();
        setOrbitEnabled(false);
        // Immediate FRONT through canvas (same as 2D tap)
        bringBubbleFront(el);
        clearGeoHold();
        geoHoldEl = el;
        geoHoldFired = false;
        geoStartX = e.clientX;
        geoStartY = e.clientY;
        el.classList.add("holding");
        geoHoldTimer = setTimeout(() => {
          geoHoldTimer = null;
          geoHoldFired = true;
          el.classList.remove("holding");
          toggleBubbleHoldLock(el);
        }, LONG_PRESS_MS);
        return;
      }

      clearGeoHold();
      // Meadow tap: clear soft FRONT (locked stay)
      selectedSpeechAgentId = "";
      for (const b of activeBubbles) {
        if (b.holdLocked) continue;
        b.el.classList.remove("front", "dimmed");
        b.el.setAttribute("aria-pressed", "false");
        b.frontPinned = false;
        clearFrontChip(b.el);
        b.el.style.removeProperty("opacity");
        b.el.style.removeProperty("filter");
      }
      if (!activeBubbles.some((b) => b.holdLocked)) {
        orbitPinnedForBubble = false;
        lastBubblePickEl = null;
        setOrbitEnabled(true);
      }
    }

    function onGlobalBubbleUp() {
      if (!geoHoldEl) return;
      const el = geoHoldEl;
      const fired = geoHoldFired;
      clearGeoHold();
      if (!fired && el) bringBubbleFront(el, { quiet: true });
    }

    function onGlobalBubbleMove(e) {
      if (!geoHoldTimer || !geoHoldEl) return;
      if (Math.hypot((e.clientX ?? 0) - geoStartX, (e.clientY ?? 0) - geoStartY) > 16) clearGeoHold();
    }

    window.addEventListener("pointerdown", onGlobalBubblePick, true);
    window.addEventListener("pointerup", onGlobalBubbleUp, true);
    window.addEventListener("pointercancel", clearGeoHold, true);
    window.addEventListener("pointermove", onGlobalBubbleMove, true);

    /** Hold speech bubbles long enough to actually read (~3.5 words/sec + pad). */
    function speechReadMs(text, minMs = 22000) {
      const words = String(text || "").trim().split(/\s+/).filter(Boolean).length;
      const byWords = Math.round((words / 3.5) * 1000) + 8000;
      return Math.max(minMs, Math.min(byWords, 55000));
    }

    function showSpeech3d(agentId, text, ms = 22000) {
      const body = String(text || "").trim();
      ms = Math.max(Number(ms) || 22000, speechReadMs(body, 22000));
      const st = agentState.find((a) => a.def.id === agentId);
      if (!st) return;
      const isSelected = selectedSpeechAgentId && agentId === selectedSpeechAgentId;

      // Update existing bubble for this agent (keep selection / lock)
      for (let i = activeBubbles.length - 1; i >= 0; i--) {
        const prev = activeBubbles[i];
        if (prev.agentId !== agentId) continue;
        if (prev.el) {
          const say = prev.el.querySelector(".say");
          if (say) say.textContent = body;
          if (prev.holdLocked) {
            prev.until = Number.POSITIVE_INFINITY;
            prev.el.classList.add("locked", "front");
            ensureFrontChip(prev.el, true);
          } else {
            prev.until = performance.now() + ms;
            if (isSelected || prev.frontPinned) {
              prev.frontPinned = true;
              bringBubbleFront(prev.el, { quiet: true });
            } else {
              // Someone else is FRONT — this agent stays dimmed/tappable, not steal top
              prev.el.classList.remove("front");
              prev.el.classList.add("dimmed");
              prev.stackRank = 300 + i;
              prev.el.style.setProperty("z-index", String(prev.stackRank), "important");
              clearFrontChip(prev.el);
            }
          }
          return;
        }
        prev.el?.remove();
        activeBubbles.splice(i, 1);
      }

      const el = document.createElement("div");
      el.className = "bubble3d";
      el.tabIndex = 0;
      el.setAttribute("role", "button");
      el.setAttribute("aria-pressed", "false");
      el.setAttribute("data-agent", agentId);
      el.setAttribute("data-locked", "0");
      el.style.position = "fixed";
      el.style.borderColor = "#" + (st.def.color >>> 0).toString(16).padStart(6, "0");
      el.style.pointerEvents = "auto";
      // New ambient lines stay below a user-selected FRONT chat
      const baseRank = isSelected ? 860 : (300 + activeBubbles.length);
      el.style.setProperty("z-index", String(baseRank), "important");
      el.title = `${st.def.name} — tap for FRONT · hold to lock`;
      el.innerHTML = `<span class="who">${escapeHtml(st.def.name)}</span><span class="say">${escapeHtml(body)}</span>`;
      bindBubbleSelect(el);
      const layer = speechLayer || document.body;
      layer.appendChild(el);
      const item = {
        el,
        mesh: st.mesh,
        agentId,
        until: performance.now() + ms,
        stackRank: baseRank,
        frontPinned: !!isSelected,
        holdLocked: false,
      };
      activeBubbles.push(item);
      st.speakUntil = item.until;
      st.nextDecideAt = Math.max(st.nextDecideAt || 0, performance.now() + 75000 + Math.random() * 45000);
      if (isSelected) {
        bringBubbleFront(el, { quiet: true });
      } else if (selectedSpeechAgentId) {
        el.classList.add("dimmed");
      }
    }

    // Offline-only fallbacks (brains down). Normal path = real AI.
    function localBark(agentId) {
      const name = AGENTS.find((a) => a.id === agentId)?.name || agentId;
      return `${name} (signal soft)… still on the meadow.`;
    }

    /** AI monologue matching whatever they already chose to do (mood/personality). */
    async function agentOwnTake(st) {
      if (!st || document.hidden) return;
      // Decide posture/path from personality first (no forced march)
      const action = decideAction(st);
      // Prop use speech happens on arrival (agentUseProp) — skip double talk here
      if (action === "prop") return;
      if (aiInFlight >= AI_MAX) return;

      const id = st.def.id;
      const name = st.def.name;
      const mood = st.persona.mood;
      const arch = st.persona.arch || "camp";
      const last = st.lastProp ? ` You recently used ${st.lastProp}; your vibe may have shifted.` : "";
      let speakPrompt = "";

      if (action === "sit" || action === "go_sit") {
        speakPrompt = `You (${name}) chose to sit at camp (mood: ${mood}, vibe: ${arch}).${last} In 2–4 sentences in character: why you're sitting, what you're noticing. You can change your mind mid-thought. No meta.`;
      } else if (action === "idle") {
        speakPrompt = `You (${name}) are standing still a moment (mood: ${mood}).${last} In 2–3 quiet in-character sentences — not forced hype. No meta.`;
      } else if (action === "social") {
        const other = st.socialTarget || "someone";
        speakPrompt = `You (${name}) are seeking ${other} (mood: ${mood}).${last} In 2–4 in-character sentences. You can revise what you meant to say. No meta.`;
      } else if (action === "fire") {
        speakPrompt = `You (${name}) drifted to the sun corona fire (mood: ${mood}).${last} In 2–4 in-character sentences about the fire. No meta.`;
      } else if (action === "house") {
        speakPrompt = `You (${name}) are walking toward a house. Mood: ${mood}.${last} In 2–4 in-character sentences. No meta.`;
      } else {
        speakPrompt = `You (${name}) chose to wander (energy ${st.energyNow.toFixed(2)}, mood: ${mood}).${last} Own take in 2–4 sentences; change direction if you want. No meta.`;
      }

      aiInFlight++;
      try {
        statusEl.textContent = `${name} · ${action}`;
        const data = await campClient.agentChat(id, speakPrompt, { ambient: true });
        const reply = String(data.reply || data.text || "").trim();
        if (reply) {
          showSpeech3d(id, reply, speechReadMs(reply));
          logLine(name, reply);
          statusEl.textContent = data.backend ? `AI · ${data.backend}` : "AI reply";
        }
      } catch (err) {
        showSpeech3d(id, localBark(id), 22000);
      } finally {
        aiInFlight = Math.max(0, aiInFlight - 1);
      }
    }

    function freeWillWave() {
      if (document.hidden) return;
      // Chill: at most one agent speaks; prefer someone actually due
      const due = agentState
        .filter((st) => performance.now() >= (st.nextDecideAt || 0))
        .sort(() => Math.random() - 0.5);
      const pool = due.length ? due : agentState.slice().sort(() => Math.random() - 0.5);
      const pick = pool[0];
      if (pick) setTimeout(() => agentOwnTake(pick), 400 + Math.random() * 800);
    }
    function updateBubbles() {
      const now = performance.now();
      // Screen positions first, then fan out overlaps so every agent is tappable
      const placed = [];
      for (let i = activeBubbles.length - 1; i >= 0; i--) {
        const b = activeBubbles[i];
        if (b.holdLocked) {
          b.until = Number.POSITIVE_INFINITY;
        } else if (now > b.until) {
          b.el.remove();
          activeBubbles.splice(i, 1);
          continue;
        }
        const v = b.mesh.position.clone();
        v.y += 2.4;
        v.project(camera);
        let x = (v.x * 0.5 + 0.5) * window.innerWidth;
        let y = (-v.y * 0.5 + 0.5) * window.innerHeight;
        if (v.z > 1 || v.z < -1) {
          b.el.style.display = "none";
          continue;
        }
        // Nudge stacked boxes so Luna / Hermes / Oracle don't sit on one click target
        for (let n = 0; n < 6; n++) {
          let clash = false;
          for (const p of placed) {
            if (Math.hypot(x - p.x, y - p.y) < 56) {
              x += (n % 2 === 0 ? 1 : -1) * (28 + n * 10);
              y -= 18 + n * 6;
              clash = true;
              break;
            }
          }
          if (!clash) break;
        }
        placed.push({ x, y, b });
        b.el.style.display = "block";
        b.el.style.left = `${x}px`;
        b.el.style.top = `${y}px`;
        // Keep FRONT above ambient for the selected agent only
        if (b.frontPinned || b.holdLocked || b.agentId === selectedSpeechAgentId) {
          b.el.style.setProperty("z-index", String(b.stackRank || 860), "important");
        }
      }
    }

    // Point-and-click: tap ground = walk, tap agent/prop/house = interact
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const pickables = () => [
      ...agentState.map((a) => a.mesh),
      ...propMeshes,
      ...houseMeshes,
      ...landmarkMeshes,
    ];

    let downX = 0, downY = 0, downT = 0;
    // Capture on canvas: block walk/orbit when a speech box is under the finger
    renderer.domElement.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      if (bubblesAtPoint(e.clientX, e.clientY).length) {
        e.preventDefault();
        e.stopPropagation();
        setOrbitEnabled(false);
        return;
      }
      downX = e.clientX;
      downY = e.clientY;
      downT = performance.now();
    }, true);
    renderer.domElement.addEventListener("pointerup", (e) => {
      if (e.button !== 0) return;
      if (bubblesAtPoint(e.clientX, e.clientY).length) return;
      if (geoHoldEl || geoHoldFired) return;
      // drag = orbit (OrbitControls); short tap = click
      if (Math.hypot(e.clientX - downX, e.clientY - downY) > 12) return;
      if (performance.now() - downT > 500) return;
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      // Prefer agents/props/houses
      const hits = raycaster.intersectObjects(pickables(), true);
      if (hits.length) {
        let obj = hits[0].object;
        while (obj && !obj.userData?.kind) obj = obj.parent;
        if (obj?.userData?.kind) {
          const u = obj.userData;
          if (u.kind === "agent") {
            whoEl.value = u.id;
            msgEl.placeholder = `Talk to ${u.name}…`;
            msgEl.focus();
