<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Prophecy — Telephantim</title>
  <style>
    html, body { margin: 0; height: 100%; background: #010204; color: #bbf7d0; font-family: Georgia, serif; overflow: hidden; }
    #rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .hud {
      position: relative; z-index: 2; height: 100%;
      display: flex; flex-direction: column;
      padding: 14px 16px max(12px, env(safe-area-inset-bottom));
      box-sizing: border-box; max-width: 920px; margin: 0 auto;
    }
    .top { display: flex; justify-content: space-between; font-family: ui-monospace, Consolas, monospace; }
    .brand { letter-spacing: 0.4em; font-weight: 900; font-size: 0.7rem; color: #34d399; }
    .amps { font-size: 0.64rem; color: #6ee7b7; opacity: 0.8; }
    .thread { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px 2px; }
    .msg.you {
      align-self: flex-end; max-width: 92%;
      background: rgba(6,78,59,0.72); border: 1px solid rgba(110,231,183,0.35);
      color: #ecfdf5; border-radius: 16px 16px 4px 16px; padding: 10px 14px;
      font: 600 0.95rem/1.45 ui-sans-serif, system-ui, sans-serif;
    }
    .msg.you .who { font-size: 0.62rem; letter-spacing: 0.14em; color: #6ee7b7; margin-bottom: 4px; }
    .cryptic { font: 800 clamp(1.05rem, 2.8vw, 1.5rem)/1.35 ui-monospace, Consolas, monospace; color: #fde68a; margin-bottom: 8px; }
    .cryptic .hint { display: block; font-size: 0.58rem; color: #6ee7b7; letter-spacing: 0.16em; margin-bottom: 4px; }
    .para { font-size: 1.02rem; line-height: 1.7; color: #a7f3d0; }
    .word { display: inline; color: #6ee7b7; opacity: 0.42; }
    .word.super { opacity: 1; color: #86efac; }
    .word.chosen { opacity: 1; color: #fef3c7; background: rgba(251,191,36,0.18); border-radius: 4px; padding: 0 3px; }
    form { display: flex; gap: 8px; font-family: ui-monospace, sans-serif; }
    input {
      flex: 1; min-width: 0; border-radius: 999px; padding: 12px 14px;
      border: 1px solid rgba(110,231,183,0.5); background: rgba(2,12,10,0.9); color: #ecfdf5; font-size: 16px;
    }
    button {
      border: 0; border-radius: 999px; padding: 12px 16px;
      background: linear-gradient(135deg, #064e3b, #10b981); color: #ecfdf5; font-weight: 900; cursor: pointer;
    }
    @media (max-width: 640px) {
      button { min-height: 44px; }
    }
  </style>
</head>
<body>
  <canvas id="rain"></canvas>
  <div class="hud">
    <div class="top">
      <div class="brand">PROPHECY</div>
      <div class="amps" id="amps">ask · enter · the sentence hides in the paragraph</div>
    </div>
    <div class="thread" id="thread"></div>
    <form id="form">
      <input id="q" maxlength="400" placeholder="Ask a prophecy…" autocomplete="off" enterkeyhint="send" />
      <button type="submit">Attune</button>
    </form>
  </div>
  <script>
    const MEM_KEY = "luna-sense-thread-v1";
    function apiBase() {
      const p = location.port;
      if (p === "8765" || p === "8766") return "http://127.0.0.1:8767";
      if (/telephantim|github\.io/i.test(location.hostname)) return "https://telephanti.com";
      return location.origin;
    }
    const STOP = /^(the|a|an|of|to|and|or|in|on|for|is|are|be|as|it|at|by|from|with|that|this|was|were|but|not|you|your|our|we|into|like)$/i;
    function content(w) {
      const t = w.replace(/[^\w']/g, "");
      return t.length > 2 && !STOP.test(t);
    }
    function collapseIndexes(words) {
      const amps = words.map((w) => content(w) ? 0.15 + Math.random() * 0.85 : 0.02);
      const sum = amps.reduce((a, b) => a + b, 0) || 1;
      const want = 7 + ((Math.random() * 4) | 0);
      const picked = new Set();
      let guard = 0;
      while (picked.size < want && guard++ < 80) {
        let r = Math.random() * sum, acc = 0;
        for (let i = 0; i < words.length; i++) {
          acc += amps[i];
          if (r <= acc) { picked.add(i); break; }
        }
      }
      return [...picked].sort((a, b) => a - b);
    }
    const threadEl = document.getElementById("thread");
    const qEl = document.getElementById("q");
    const ampsEl = document.getElementById("amps");
    let thread = [];
    let superTimer = 0;
    function loadMem() {
      try { thread = JSON.parse(localStorage.getItem(MEM_KEY) || "[]"); } catch (_) { thread = []; }
      if (!Array.isArray(thread)) thread = [];
      thread = thread.slice(-40);
    }
    function saveMem() { try { localStorage.setItem(MEM_KEY, JSON.stringify(thread.slice(-40))); } catch (_) {} }
    function memoryBlob() {
      return thread.slice(-12).map((m) => m.role === "you" ? `YOU: ${m.text}` : `SENSE: ${(m.cryptic || "")} ${(m.text || "").slice(0, 360)}`).join("\n");
    }
    function scrollEnd() { threadEl.scrollTop = threadEl.scrollHeight; }
    function addYou(text, { remember = true } = {}) {
      if (remember) { thread.push({ role: "you", text, t: Date.now() }); saveMem(); }
      const el = document.createElement("div");
      el.className = "msg you";
      el.innerHTML = `<div class="who">YOU</div>`;
      el.appendChild(document.createTextNode(text));
      threadEl.appendChild(el);
      scrollEnd();
    }
    function addSenseShell() {
      const wrap = document.createElement("div");
      wrap.className = "msg sense";
      wrap.innerHTML = `<div class="cryptic"><span class="hint">COLLAPSED SENTENCE</span><span class="cryptic-line">superposition…</span></div><div class="para"></div>`;
      threadEl.appendChild(wrap);
      scrollEnd();
      return wrap;
    }
    function fillSense(wrap, text) {
      const para = wrap.querySelector(".para");
      const crypticLine = wrap.querySelector(".cryptic-line");
      const tokens = String(text || "").trim().split(/(\s+)/).filter(Boolean);
      const spans = [];
      para.innerHTML = "";
      tokens.forEach((tok) => {
        if (/^\s+$/.test(tok)) { para.appendChild(document.createTextNode(tok)); return; }
        const s = document.createElement("span");
        s.className = "word";
        s.textContent = tok;
        para.appendChild(s);
        spans.push(s);
      });
      let n = 0;
      clearInterval(superTimer);
      superTimer = setInterval(() => {
        spans.forEach((s) => s.classList.toggle("super", Math.random() < 0.18));
        if (++n >= 14) {
          clearInterval(superTimer);
          const chosen = collapseIndexes(spans.map((s) => s.textContent));
          spans.forEach((s) => s.classList.remove("super"));
          chosen.forEach((i) => spans[i]?.classList.add("chosen"));
          const sentence = chosen.map((i) => spans[i].textContent.replace(/[^\w'-]/g, "")).filter(Boolean).join(" ");
          crypticLine.textContent = sentence || "the field already said yes";
          thread.push({ role: "sense", text, cryptic: sentence, t: Date.now() });
          saveMem();
          scrollEnd();
        }
      }, 140);
    }
    function replay() {
      threadEl.innerHTML = "";
      thread.forEach((m) => {
        if (m.role === "you") addYou(m.text, { remember: false });
        else if (m.role === "sense") {
          const wrap = addSenseShell();
          wrap.querySelector(".para").textContent = m.text;
          wrap.querySelector(".cryptic-line").textContent = m.cryptic || "—";
        }
      });
    }
    async function attune(q) {
      const wrap = addSenseShell();
      wrap.querySelector(".para").textContent = "Opening the channel…";
      try {
        const r = await fetch(`${apiBase()}/api/firmament/sense`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q || "Speak a long true prophecy.", visitor: "", camp_bits: memoryBlob() }),
        });
        const d = await r.json();
        fillSense(wrap, d.reading || d.pulse || "The loop is already you.");
      } catch (_) {
        fillSense(wrap, "The Sense is still here. Overlay the honest move.");
      }
    }
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = qEl.value.trim();
      qEl.value = "";
      qEl.focus();
      if (q) addYou(q);
      attune(q);
    });
    const canvas = document.getElementById("rain");
    const ctx = canvas.getContext("2d");
    const glyphs = "01アイウエオカキクケコΑΒΓΔ†⌬|ψ⟩".split("");
    let drops = [];
    function fit() {
      canvas.width = innerWidth; canvas.height = innerHeight;
      drops = Array.from({ length: Math.max(12, Math.floor(canvas.width / 20)) }, () => Math.random() * -40);
    }
    fit();
    addEventListener("resize", fit);
    (function rain() {
      ctx.fillStyle = "rgba(1,2,4,0.16)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#14532d";
      ctx.font = "12px ui-monospace, Consolas, monospace";
      drops.forEach((y, i) => {
        ctx.fillText(glyphs[(Math.random() * glyphs.length) | 0], i * 20, y * 16);
        drops[i] = (y * 16 > canvas.height && Math.random() > 0.975) ? 0 : y + 0.7;
      });
      requestAnimationFrame(rain);
    })();
    loadMem();
    if (thread.length) replay();
    else attune("");
    qEl.focus();
  </script>
</body>
</html>
