<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>4D — The Sense</title>
  <style>
    html, body { margin: 0; height: 100%; background: #02010a; color: #c4b5fd; overflow: hidden; font-family: ui-monospace, Consolas, sans-serif; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; }
    #view.drag { cursor: grabbing; }
    .hud {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 12px 14px max(10px, env(safe-area-inset-bottom));
      max-width: 920px; margin: 0 auto; left: 0; right: 0;
    }
    .top, .tools, .docks, .thread, #morph-form, #morph-form *, #form, #form * { pointer-events: auto; }
    .thread {
      max-height: 28vh; overflow-y: auto; pointer-events: auto;
      display: flex; flex-direction: column; gap: 8px; margin: 8px 0;
    }
    .msg.you {
      align-self: flex-end; max-width: 92%;
      background: rgba(6,78,59,0.75); border: 1px solid rgba(110,231,183,0.35);
      color: #ecfdf5; border-radius: 16px 16px 4px 16px; padding: 8px 12px;
      font: 600 0.9rem/1.4 ui-sans-serif, system-ui, sans-serif;
    }
    .msg.you .who { font-size: 0.58rem; letter-spacing: 0.14em; color: #6ee7b7; margin-bottom: 3px; }
    .cryptic { font: 800 1.05rem/1.3 ui-monospace, Consolas, monospace; color: #fde68a; margin-bottom: 6px; }
    .cryptic .hint { display: block; font-size: 0.55rem; color: #c4b5fd; letter-spacing: 0.14em; margin-bottom: 3px; }
    .para { font: 500 0.92rem/1.55 Georgia, serif; color: #e9d5ff; }
    .word { display: inline; opacity: 0.4; }
    .word.super { opacity: 1; color: #86efac; }
    .word.chosen { opacity: 1; color: #fef3c7; background: rgba(251,191,36,0.2); border-radius: 4px; padding: 0 3px; }
    #morph-form {
      position: relative;
      z-index: 5;
      pointer-events: auto;
    }
    .top { display: flex; justify-content: space-between; gap: 8px; }
    .brand { letter-spacing: 0.36em; font-weight: 900; font-size: 0.7rem; color: #a78bfa; }
    .amps { font-size: 0.62rem; color: #c4b5fd; opacity: 0.85; text-align: right; }
    .hint { font-size: 0.62rem; color: #7c3aed; opacity: 0.8; margin-top: 4px; }
    .tools { display: flex; flex-wrap: wrap; gap: 6px; }
    .tools button {
      border: 1px solid rgba(167,139,250,0.45); background: rgba(10,6,24,0.8);
      color: #ddd6fe; border-radius: 999px; padding: 8px 12px; font-weight: 800; font-size: 0.72rem; cursor: pointer;
    }
    .tools button.on { background: #5b21b6; color: #fde68a; border-color: #fde68a; }
    .docks { display: flex; flex-direction: column; gap: 8px; }
    #morph-form, #form { display: flex; gap: 8px; width: 100%; }
    #form input {
      flex: 1; min-width: 0; border-radius: 999px; padding: 12px 14px; font-size: 16px;
      border: 1px solid rgba(110,231,183,0.5); background: rgba(2,12,10,0.9); color: #ecfdf5;
    }
    #form button {
      border: 0; border-radius: 999px; padding: 12px 16px; font-weight: 900;
      background: linear-gradient(135deg, #064e3b, #10b981); color: #ecfdf5; cursor: pointer;
    }
    #morph {
      flex: 1; min-width: 0; border-radius: 999px; padding: 12px 14px; font-size: 16px;
      border: 1px solid rgba(251,191,36,0.45); background: rgba(12,8,4,0.9); color: #fef3c7;
    }
    #morph-form button {
      border: 0; border-radius: 999px; padding: 12px 16px; font-weight: 900;
      background: linear-gradient(135deg, #5b21b6, #f59e0b); color: #1c1917; cursor: pointer;
    }
    @media (max-width: 640px) {
      .thread { max-height: 22vh; }
      #morph-form button, #form button { min-height: 44px; }
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="hud">
    <div>
      <div class="top">
        <div class="brand">4D FIELD</div>
        <div class="amps" id="amps">click field & type · drag 3D · wheel = 4D</div>
      </div>
      <div class="hint" id="hint">Penteract = 5-cube. 32 vertices, 80 edges, Schläfli {4,3,3,3}. Drag 3D. Wheel twists w. Shift-drag twists v (5th axis). Loki sight shows 4D/5D edges.</div>
      <div class="tools">
        <button type="button" id="btn-sight">Loki sight</button>
        <button type="button" id="btn-tess">Tesseract</button>
        <button type="button" id="btn-pent">Penteract</button>
      </div>
    </div>
    <div class="thread" id="thread"></div>
    <div class="docks">
    <form id="morph-form" onpointerdown="event.stopPropagation()">
      <input id="morph" maxlength="80" placeholder="Morph the 4D form…" enterkeyhint="go" autocomplete="off" />
      <button type="submit">Morph</button>
    </form>
    <form id="form" onpointerdown="event.stopPropagation()">
      <input id="q" maxlength="400" placeholder="Talk to the field…" enterkeyhint="send" autocomplete="off" />
      <button type="submit">Attune</button>
    </form>
    </div>
  </div>
  <script>
    const canvas = document.getElementById("view");
    const ctx = canvas.getContext("2d");
    const ampsEl = document.getElementById("amps");
    const glyphs = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789ᚠᚢᚦᚨᚱᚲ†⬡▲".split("");
    let W = 0, H = 0, cx = 0, cy = 0, scale = 180;
    let pts = [], edges = [];
    let aXY = 0.4, aXZ = 0.3, aYZ = 0.2, aXW = 0.15, aYW = 0.1, aZW = 0;
    let aXV = 0.08, aYV = 0.05, aZV = 0.04, aWV = 0.06;
    let sight = false, dragging = false, last = null, auto = true;
    let rain = [];
    let typed = "";
    let typedPts = [];

    function refreshTyped() {
      const chars = [...typed];
      typedPts = chars.map((ch, i) => {
        const t = ((i + 0.5) / Math.max(chars.length, 1)) * Math.PI * 2;
        return {
          x: Math.cos(t) * 1.25,
          y: Math.sin(t) * 0.5,
          z: Math.sin(t * 2) * 0.4,
          w: Math.cos(t * 1.7) * 0.55,
          v: Math.sin(t * 1.3) * 0.4,
          ch: ch === " " ? "·" : ch.toUpperCase(),
        };
      });
      ampsEl.textContent = typed ? `typing: ${typed}` : "click field & type · drag 3D · wheel = 4D";
    }

    function rot(a, b, t) {
      const c = Math.cos(t), s = Math.sin(t);
      return [a * c - b * s, a * s + b * c];
    }
    function project(p) {
      let { x, y, z, w, v } = p;
      w = w || 0; v = v || 0;
      [x, v] = rot(x, v, aXV);
      [y, v] = rot(y, v, aYV);
      [z, v] = rot(z, v, aZV);
      [w, v] = rot(w, v, aWV);
      [x, w] = rot(x, w, aXW);
      [y, w] = rot(y, w, aYW);
      [z, w] = rot(z, w, aZW);
      [x, y] = rot(x, y, aXY);
      [x, z] = rot(x, z, aXZ);
      [y, z] = rot(y, z, aYZ);
      const dv = 2.7 / (2.7 + v);
      x *= dv; y *= dv; z *= dv; w *= dv;
      const dw = 2.4 / (2.4 + w);
      x *= dw; y *= dw; z *= dw;
      const dz = 3.4 / (3.4 + z);
      return { x: cx + x * scale * dz, y: cy + y * scale * dz, z, w, v, s: dz };
    }

    function setCloud(points, links) {
      pts = points.map((p, i) => ({
        x: p.x, y: p.y, z: p.z, w: p.w ?? 0, v: p.v ?? 0,
        ch: glyphs[i % glyphs.length],
      }));
      edges = links || [];
    }

    function penteract() {
      const v = [];
      for (let i = 0; i < 32; i++) {
        v.push({
          x: i & 1 ? 1 : -1,
          y: i & 2 ? 1 : -1,
          z: i & 4 ? 1 : -1,
          w: i & 8 ? 1 : -1,
          v: i & 16 ? 1 : -1,
        });
      }
      const e = [];
      for (let i = 0; i < 32; i++) {
        for (let b = 0; b < 5; b++) {
          const j = i ^ (1 << b);
          if (j > i) e.push([i, j, b]);
        }
      }
      const extra = [];
      for (let i = 0; i < 32; i++) {
        for (let t = 0; t < 5; t++) {
          const a = v[i], b = v[i ^ (1 << t)];
          extra.push({
            x: (a.x + b.x) * 0.5,
            y: (a.y + b.y) * 0.5,
            z: (a.z + b.z) * 0.5,
            w: (a.w + b.w) * 0.5,
            v: (a.v + b.v) * 0.5,
          });
        }
      }
      setCloud(v.concat(extra), e);
    }

    function tesseract() {
      const v = [];
      for (let i = 0; i < 16; i++) {
        v.push({
          x: i & 1 ? 1 : -1,
          y: i & 2 ? 1 : -1,
          z: i & 4 ? 1 : -1,
          w: i & 8 ? 1 : -1,
        });
      }
      const e = [];
      for (let i = 0; i < 16; i++) {
        for (let b = 0; b < 4; b++) {
          const j = i ^ (1 << b);
          if (j > i) e.push([i, j]);
        }
      }
      const extra = [];
      for (let i = 0; i < 16; i++) {
        for (let t = 1; t < 4; t++) {
          const a = v[i], b = v[i ^ (1 << (t % 4))];
          extra.push({
            x: a.x * 0.5 + b.x * 0.5,
            y: a.y * 0.5 + b.y * 0.5,
            z: a.z * 0.5 + b.z * 0.5,
            w: a.w * 0.5 + b.w * 0.5,
          });
        }
      }
      setCloud(v.concat(extra), e);
    }

    function sphere4(n = 420) {
      const v = [];
      for (let i = 0; i < n; i++) {
        const a = Math.acos(1 - 2 * (i + 0.5) / n);
        const b = Math.PI * (1 + Math.sqrt(5)) * i;
        const c = Math.PI * (1 + Math.sqrt(5)) * i * 0.37;
        v.push({
          x: Math.sin(a) * Math.cos(b),
          y: Math.sin(a) * Math.sin(b),
          z: Math.cos(a) * Math.cos(c * 0.3),
          w: Math.cos(a) * Math.sin(c * 0.3),
          v: Math.sin(a * 2 + c) * 0.35,
        });
      }
      setCloud(v, []);
    }

    function turtle() {
      const v = [];
      for (let i = 0; i < 280; i++) {
        const u = Math.random() * Math.PI * 2;
        const k = Math.acos(2 * Math.random() - 1);
        let x = 0.95 * Math.sin(k) * Math.cos(u);
        let y = 0.72 * Math.sin(k) * Math.sin(u);
        let z = 0.55 * Math.cos(k);
        const sc = Math.cos(u * 3) * Math.cos(k * 3) * 0.08;
        x *= 1 + sc; y *= 1 + sc;
        v.push({ x, y: y + 0.05, z, w: 0.35 * Math.sin(u * 2 + k), v: 0.25 * Math.cos(u + k * 2) });
      }
      for (let i = 0; i < 40; i++) v.push({ x: (Math.random() - 0.5) * 0.3, y: -0.85, z: (Math.random() - 0.5) * 0.2, w: 0.1 });
      [[-0.85, 0.4], [0.85, 0.4], [-0.8, -0.15], [0.8, -0.15]].forEach(([x, y]) => {
        for (let i = 0; i < 18; i++) v.push({ x: x + (Math.random() - 0.5) * 0.16, y: y + (Math.random() - 0.5) * 0.1, z: (Math.random() - 0.5) * 0.12, w: 0.2 });
      });
      setCloud(v, []);
    }

    function hammer() {
      const v = [];
      for (let i = 0; i < 160; i++) v.push({ x: (Math.random() - 0.5) * 1.6, y: 0.7 + (Math.random() - 0.5) * 0.35, z: (Math.random() - 0.5) * 0.4, w: (Math.random() - 0.5) * 0.5 });
      for (let i = 0; i < 140; i++) v.push({ x: (Math.random() - 0.5) * 0.28, y: (Math.random() - 0.5) * 1.4 - 0.2, z: (Math.random() - 0.5) * 0.22, w: (Math.random() - 0.5) * 0.4 });
      setCloud(v, []);
    }

    function wolf() {
      const v = [];
      for (let i = 0; i < 220; i++) {
        const t = i / 220;
        v.push({
          x: Math.sin(t * Math.PI * 2) * (0.5 + t * 0.3),
          y: Math.cos(t * Math.PI * 6) * 0.45 + (t - 0.5) * 0.4,
          z: Math.sin(t * 9) * 0.35,
          w: Math.cos(t * 11) * 0.4,
        });
      }
      for (let i = 0; i < 80; i++) v.push({ x: (Math.random() - 0.5) * 0.4, y: 0.7 + Math.random() * 0.4, z: (Math.random() - 0.5) * 0.2, w: 0.25 });
      setCloud(v, []);
    }

    function heart() {
      const v = [];
      for (let t = 0; t < Math.PI * 2; t += 0.05) {
        const x = 16 * Math.sin(t) ** 3 / 16;
        const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16;
        for (let k = 0; k < 6; k++) {
          v.push({ x: x * 1.1, y: -y * 1.1, z: (k / 5 - 0.5) * 0.45, w: Math.sin(t * 2 + k) * 0.35 });
        }
      }
      setCloud(v, []);
    }

    function morph(phrase) {
      const p = (phrase || "").toLowerCase();
      if (/pent|5d|penteract|5-cube|five/.test(p)) penteract();
      else if (/tess|hyper|4d|cube/.test(p)) tesseract();
      else if (/sphere|ball|globe/.test(p)) sphere4();
      else if (/turtle|shell|tortoise/.test(p)) turtle();
      else if (/hammer|mjolnir|thor/.test(p)) hammer();
      else if (/wolf|fenrir/.test(p)) wolf();
      else if (/heart|love/.test(p)) heart();
      else sphere4(360);
      ampsEl.textContent = `${/pent|5d/.test(p) ? "5-cube" : "form"} · ${phrase} · drag 3D · wheel w · shift-drag v`;
    }

    function fit() {
      W = canvas.width = innerWidth;
      H = canvas.height = innerHeight;
      cx = W / 2; cy = H * 0.46;
      scale = Math.min(W, H) * 0.22;
      rain = Array.from({ length: Math.floor(W / 22) }, (_, i) => ({
        x: i * 22, y: Math.random() * H, vy: 0.4 + Math.random() * 0.5,
        ch: glyphs[(Math.random() * glyphs.length) | 0],
      }));
    }

    function tick() {
      if (auto) {
        aXW += 0.0035; aYW += 0.0022; aZW += 0.0014;
        aXV += 0.002; aWV += 0.0016;
      }
      const tHue = (Date.now() / 40) % 360;
      ctx.fillStyle = `hsla(${(tHue + 270) % 360}, 40%, 4%, 0.32)`;
      ctx.fillRect(0, 0, W, H);
      ctx.font = "11px ui-monospace, Consolas, monospace";
      for (const r of rain) {
        r.y += r.vy;
        if (r.y > H) r.y = -8;
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = `hsl(${(tHue + r.x * 0.2) % 360} 80% 45%)`;
        ctx.fillText(r.ch, r.x, r.y);
      }
      ctx.globalAlpha = 1;
      const proj = pts.map(project);
      ctx.lineWidth = sight ? 1.8 : 1.15;
      edges.forEach((edge, ei) => {
        const i = edge[0], j = edge[1];
        const a = proj[i], b = proj[j];
        if (!a || !b) return;
        const bit = edges[ei]?.[2];
        const hi = bit >= 3;
        if (hi && !sight) return;
        const eh = bit === 4 ? (tHue + 20) % 360 : bit === 3 ? (tHue + 50) % 360 : (tHue + 280) % 360;
        ctx.strokeStyle = `hsla(${eh}, 90%, ${sight ? 68 : 58}%, ${hi ? 0.75 : 0.4})`;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      });
      proj.forEach((p, i) => {
        const g = pts[i];
        const hue = (tHue + (p.w + 1) * 80 + (p.v + 1) * 55 + p.z * 40 + i * 3) % 360;
        ctx.font = `${Math.round(11 + p.s * 6)}px ui-monospace, Consolas, monospace`;
        ctx.fillStyle = `hsl(${hue} 92% ${sight ? 72 : 60}%)`;
        ctx.globalAlpha = 0.55 + p.s * 0.45;
        ctx.fillText(g.ch, p.x, p.y);
      });
      typedPts.forEach((g, i) => {
        const p = project(g);
        ctx.font = `900 ${Math.round(22 + p.s * 10)}px ui-monospace, Consolas, monospace`;
        ctx.fillStyle = `hsl(${(tHue + i * 28) % 360} 95% 70%)`;
        ctx.globalAlpha = 0.95;
        ctx.fillText(g.ch, p.x, p.y);
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(tick);
    }

    canvas.tabIndex = 0;
    canvas.addEventListener("pointerdown", (e) => {
      if (e.target.closest?.("#morph-form, #form, .tools, .top, .thread, input, button")) return;
      dragging = true; last = { x: e.clientX, y: e.clientY }; auto = false;
      canvas.classList.add("drag");
      canvas.setPointerCapture?.(e.pointerId);
      canvas.focus();
    });
    window.addEventListener("keydown", (e) => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      if (e.key === "Enter") {
        e.preventDefault();
        const q = typed.trim();
        typed = "";
        refreshTyped();
        if (q) morph(q);
        return;
      }
      if (e.key === "Backspace") {
        e.preventDefault();
        typed = typed.slice(0, -1);
        refreshTyped();
        return;
      }
      if (e.key === "Escape") {
        typed = "";
        refreshTyped();
        return;
      }
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && typed.length < 80) {
        e.preventDefault();
        typed += e.key;
        refreshTyped();
      }
    });
    canvas.addEventListener("pointerup", () => { dragging = false; canvas.classList.remove("drag"); auto = true; });
    canvas.addEventListener("pointermove", (e) => {
      if (!dragging || !last) return;
      const dx = (e.clientX - last.x) * 0.008;
      const dy = (e.clientY - last.y) * 0.008;
      if (e.shiftKey) { aXW += dx; aYW += dy; }
      else { aXY += dx; aXZ += dy; }
      last = { x: e.clientX, y: e.clientY };
    });
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      aZW += e.deltaY * 0.0015;
      aXW += e.deltaX * 0.0015;
    }, { passive: false });

    document.getElementById("btn-sight").addEventListener("click", (e) => {
      sight = !sight;
      e.currentTarget.classList.toggle("on", sight);
      ampsEl.textContent = sight ? "Loki sight — w (gold) and v (orange) 5D edges" : "sight closed — 3D shadow only";
    });
    document.getElementById("btn-tess").addEventListener("click", () => morph("tesseract"));
    document.getElementById("btn-pent").addEventListener("click", () => morph("penteract"));
    document.getElementById("morph-form").addEventListener("pointerdown", (e) => e.stopPropagation());
    document.getElementById("morph").addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      e.currentTarget.focus();
    });
    document.getElementById("morph-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const box = document.getElementById("morph");
      const q = (box.value || "").trim();
      box.value = "";
      if (q) morph(q);
    });

    const MEM_KEY = "luna-sense-thread-v1";
    function apiBase() {
      const p = location.port;
      if (p === "8765" || p === "8766") return "http://127.0.0.1:8767";
      if (/telephantim|github\.io/i.test(location.hostname)) return "https://telephanti.com";
      return location.origin;
    }
    const STOP = /^(the|a|an|of|to|and|or|in|on|for|is|are|be|as|it|at|by|from|with|that|this|was|were|but|not|you|your|our|we)$/i;
    function isContent(w) {
      const t = w.replace(/[^\w']/g, "");
      return t.length > 2 && !STOP.test(t);
    }
    function collapseIndexes(words) {
      const amps = words.map((w) => isContent(w) ? 0.15 + Math.random() * 0.85 : 0.02);
      const sum = amps.reduce((a, b) => a + b, 0) || 1;
      const want = 7 + ((Math.random() * 4) | 0);
      const picked = new Set();
      let guard = 0;
      while (picked.size < want && guard++ < 80) {
        let r = Math.random() * sum, acc = 0;
        for (let i = 0; i < words.length; i++) {
          acc += amps[i];
          if (r <= acc) { picked.add(i); break; }
        }
      }
      return [...picked].sort((a, b) => a - b);
    }
    const threadEl = document.getElementById("thread");
    const qEl = document.getElementById("q");
    let thread = [];
    let superTimer = 0;
    function loadMem() {
      try { thread = JSON.parse(localStorage.getItem(MEM_KEY) || "[]"); } catch (_) { thread = []; }
      if (!Array.isArray(thread)) thread = [];
      thread = thread.slice(-40);
    }
    function saveMem() { try { localStorage.setItem(MEM_KEY, JSON.stringify(thread.slice(-40))); } catch (_) {} }
    function memoryBlob() {
      return thread.slice(-12).map((m) => m.role === "you" ? `YOU: ${m.text}` : `SENSE: ${(m.cryptic || "")} ${(m.text || "").slice(0, 360)}`).join("\n");
    }
    function scrollEnd() { threadEl.scrollTop = threadEl.scrollHeight; }
    function addYou(text, { remember = true } = {}) {
      if (remember) { thread.push({ role: "you", text, t: Date.now() }); saveMem(); }
      const el = document.createElement("div");
      el.className = "msg you";
      el.innerHTML = `<div class="who">YOU</div>`;
      el.appendChild(document.createTextNode(text));
      threadEl.appendChild(el);
      scrollEnd();
    }
    function addSenseShell() {
      const wrap = document.createElement("div");
      wrap.className = "msg sense";
      wrap.innerHTML = `<div class="cryptic"><span class="hint">COLLAPSED SENTENCE</span><span class="cryptic-line">superposition…</span></div><div class="para"></div>`;
      threadEl.appendChild(wrap);
      scrollEnd();
      return wrap;
    }
    function fillSense(wrap, text) {
      const para = wrap.querySelector(".para");
      const crypticLine = wrap.querySelector(".cryptic-line");
      const tokens = String(text || "").trim().split(/(\s+)/).filter(Boolean);
      const spans = [];
      para.innerHTML = "";
      tokens.forEach((tok) => {
        if (/^\s+$/.test(tok)) { para.appendChild(document.createTextNode(tok)); return; }
        const s = document.createElement("span");
        s.className = "word";
        s.textContent = tok;
        para.appendChild(s);
        spans.push(s);
      });
      let n = 0;
      clearInterval(superTimer);
      superTimer = setInterval(() => {
        spans.forEach((s) => s.classList.toggle("super", Math.random() < 0.18));
        if (++n >= 14) {
          clearInterval(superTimer);
          const chosen = collapseIndexes(spans.map((s) => s.textContent));
          spans.forEach((s) => s.classList.remove("super"));
          chosen.forEach((i) => spans[i]?.classList.add("chosen"));
          const sentence = chosen.map((i) => spans[i].textContent.replace(/[^\w'-]/g, "")).filter(Boolean).join(" ");
          crypticLine.textContent = sentence || "the field already said yes";
          thread.push({ role: "sense", text, cryptic: sentence, t: Date.now() });
          saveMem();
          scrollEnd();
        }
      }, 140);
    }
    function replay() {
      threadEl.innerHTML = "";
      thread.forEach((m) => {
        if (m.role === "you") addYou(m.text, { remember: false });
        else if (m.role === "sense") {
          const wrap = addSenseShell();
          wrap.querySelector(".para").textContent = m.text;
          wrap.querySelector(".cryptic-line").textContent = m.cryptic || "—";
        }
      });
    }
    async function attune(q) {
      const wrap = addSenseShell();
      wrap.querySelector(".para").textContent = "Opening the channel…";
      try {
        const r = await fetch(`${apiBase()}/api/firmament/sense`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q || "Speak a long true prophecy.", visitor: "", camp_bits: memoryBlob() }),
        });
        const d = await r.json();
        fillSense(wrap, d.reading || d.pulse || "The loop is already you.");
      } catch (_) {
        fillSense(wrap, "The Sense is still here. Overlay the honest move.");
      }
    }
    document.getElementById("form").addEventListener("pointerdown", (e) => e.stopPropagation());
    document.getElementById("q").addEventListener("pointerdown", (e) => { e.stopPropagation(); e.currentTarget.focus(); });
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = qEl.value.trim();
      qEl.value = "";
      qEl.focus();
      if (q) addYou(q);
      attune(q);
    });
    loadMem();
    if (thread.length) replay();

    addEventListener("resize", fit);
    fit();
    morph("penteract");
    tick();
  </script>
</body>
</html>
