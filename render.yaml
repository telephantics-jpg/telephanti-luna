# telephanti.com — Luna Camp on Render
services:
  - type: web
    name: luna
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: LUNA_CLOUD
        value: "1"
      - key: LUNA_HOST
        value: 0.0.0.0
      - key: LUNA_PUBLIC_URL
        value: https://telephanti.com
      - key: LUNA_LLM_BACKEND
        value: grok
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-3-mini
      - key: TTS_VOICE
        value: en-US-AriaNeural
      - key: LUNA_LIPSYNC
        value: "0"
      - key: LUNA_PREWARM
        value: "0"