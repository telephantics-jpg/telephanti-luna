        border-radius: 12px !important;
      }
      .bubble3d .bubble-x {
        width: 32px !important;
        height: 32px !important;
        top: 2px !important;
        right: 2px !important;
        font-size: 1.05rem !important;
      }
      .bubble3d .who {
        font-size: 0.6rem !important;
        margin-bottom: 2px !important;
        padding-right: 22px !important;
      }
      .bubble3d .say {
        font-size: 0.72rem !important;
        max-height: min(22vh, 120px) !important;
      }
      .bubble3d.compact {
        width: min(160px, 48vw) !important;
        max-height: 72px !important;
        padding: 6px 8px !important;
        font-size: 0.66rem !important;
      }
      .bubble3d.front,
      .bubble3d.locked,
      .bubble3d.pinned-open {
        width: min(92vw, 340px) !important;
        height: auto !important;
        min-height: 0 !important;
        max-height: min(52vh, 360px) !important;
        padding: 10px 12px !important;
        font-size: 0.82rem !important;
      }
      .bubble3d.front .say,
      .bubble3d.locked .say,
      .bubble3d.pinned-open .say {
        max-height: min(42vh, 300px) !important;
      }
      #btn-open-chat3d {
        bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        padding: 8px 12px;
        font-size: 0.74rem;
      }
      #dock {
        padding-bottom: max(8px, env(safe-area-inset-bottom));
      }
      #talk-row { gap: 6px; }
      #msg { font-size: 0.84rem; }
    }

    /* ── House / center interior (2D-parity visit) ── */
    #place-interior {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 70;
      background: radial-gradient(ellipse at 50% 20%, rgba(63, 36, 14, 0.55), rgba(8, 12, 28, 0.94) 70%);
      flex-direction: column;
      pointer-events: auto;
    }
    #place-interior.open { display: flex; }
    #place-interior .pi-head {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid rgba(154, 149, 140,0.25);
    }
    #place-interior .pi-head h2 { margin: 0; flex: 1; font-size: 1.1rem; color: #e8ddc0; }
    #place-interior .pi-sub { font-size: 0.72rem; color: #9a958c; letter-spacing: 0.06em; text-transform: uppercase; }
    #place-interior .pi-exit {
      background: rgba(24, 20, 14,0.85); border: 1px solid #7a756c; color: #e8ddc0;
      border-radius: 10px; padding: 8px 12px; cursor: pointer; font: inherit; font-weight: 700;
    }
    #place-interior .pi-body {
      flex: 1; display: grid; grid-template-columns: 1.1fr 1fr; gap: 12px;
      padding: 12px 16px; min-height: 0; overflow: auto;
    }
    @media (max-width: 720px) {
      #place-interior .pi-body { grid-template-columns: 1fr; }
    }
    #place-interior .pi-room {
      position: relative; border-radius: 16px; overflow: hidden;
      min-height: 220px; border: 1px solid rgba(154, 149, 140,0.3);
      background: linear-gradient(180deg, #17140f 0%, #17140f 55%, #17140f 100%);
    }
    #place-interior .pi-room-glow {
      position: absolute; inset: 10% 15% auto; height: 40%;
      background: radial-gradient(circle, rgba(251,191,36,0.35), transparent 70%);
      pointer-events: none;
    }
    #place-interior .pi-room-floor {
      position: absolute; left: 8%; right: 8%; bottom: 8%; height: 28%;
      background: linear-gradient(180deg, rgba(120,80,40,0.35), rgba(60,40,20,0.7));
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.06);
    }
    #place-interior .pi-room-window {
      position: absolute; top: 18%; right: 14%; width: 22%; height: 28%;
      background: linear-gradient(160deg, rgba(200,153,60,0.45), rgba(191, 162, 104,0.35));
      border-radius: 8px; border: 2px solid rgba(226,232,240,0.35);
      box-shadow: 0 0 24px rgba(200,153,60,0.25);
    }
    #place-interior .pi-room-label {
      position: absolute; left: 12px; bottom: 12px; color: #9a958c; font-size: 0.8rem;
    }
    #place-interior .pi-host {
      background: rgba(24, 20, 14,0.72); border: 1px solid rgba(154, 149, 140,0.28);
      border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
    }
    #place-interior .pi-host-row { display: flex; gap: 12px; align-items: flex-start; }
    #place-interior .pi-portrait {
      width: 88px; height: 88px; border-radius: 16px; flex-shrink: 0;
      border: 2px solid rgba(251,191,36,0.55); overflow: hidden; position: relative;
      background: radial-gradient(circle at 40% 30%, #3d3a34, #17140f);
      display: grid; place-items: center;
    }
    #place-interior .pi-portrait img {
      width: 100%; height: 100%; object-fit: cover; display: none;
    }
    #place-interior .pi-portrait img.show { display: block; }
    #place-interior .pi-portrait .pi-glyph {
      font-size: 2.2rem; line-height: 1; position: absolute;
    }
    #place-interior .pi-portrait.img-on .pi-glyph { display: none; }
    #place-interior .pi-home-badge {
      display: inline-block; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.04em;
      padding: 3px 8px; border-radius: 999px; margin-top: 4px;
    }
    #place-interior .pi-home-badge.home {
      background: rgba(180, 121, 25,0.2); color: #f0d493; border: 1px solid rgba(180, 121, 25,0.45);
    }
    #place-interior .pi-home-badge.away {
      background: rgba(156,31,31,0.15); color: #f0d493; border: 1px solid rgba(156,31,31,0.4);
    }
    #place-interior .pi-host h3 { margin: 0; color: #e8ddc0; font-size: 1.05rem; }
    #place-interior .pi-vibe { margin: 0; color: #9a958c; font-size: 0.82rem; line-height: 1.4; }
    #place-interior .pi-guests { margin: 0; color: #f0d493; font-size: 0.8rem; line-height: 1.45; }
    #place-interior .pi-guest-list {
      display: flex; flex-wrap: wrap; gap: 6px; max-height: 120px; overflow-y: auto;
    }
    #place-interior .pi-guest-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(42, 34, 26,0.95); border: 1px solid #57534e; color: #e8ddc0;
      border-radius: 999px; padding: 4px 10px 4px 4px; font-size: 0.78rem; cursor: pointer; font: inherit;
    }
    #place-interior .pi-guest-chip.on {
      border-color: #c8993c; background: rgba(200,153,60,0.15); color: #e8ddc0;
    }
    #place-interior .pi-guest-chip .dot {
      width: 10px; height: 10px; border-radius: 50%;
    }
    #place-interior .pi-guest-chip .chip-face {
      width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
      border: 1px solid rgba(154, 149, 140,0.45); background: #2a2620; flex-shrink: 0;
    }
    #place-interior .pi-guest-chip .chip-face.glyph {
      display: grid; place-items: center; font-size: 0.95rem; border-style: dashed;
    }
    #place-interior .pi-portrait {
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 12px 28px rgba(0,0,0,0.45);
    }
    #place-interior .pi-host-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    #place-interior .pi-bubble {
      margin-top: auto; background: rgba(42, 34, 26,0.9); border: 1px solid rgba(200,153,60,0.35);
      border-radius: 12px; padding: 10px 12px; color: #e8ddc0; font-size: 0.9rem; line-height: 1.45;
      min-height: 3.2em;
    }
    #place-interior .pi-talk {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px 16px 14px; border-top: 1px solid rgba(154, 149, 140,0.22);
      background: rgba(23,20,15,0.85);
    }
    #place-interior .pi-talk input {
      flex: 1; min-width: 160px; background: #17140f; border: 1px solid #3d3a34;
      color: #e8ddc0; border-radius: 10px; padding: 10px 12px; font: inherit;
    }
    #place-interior .pi-talk button {
      background: linear-gradient(135deg, #8a5512, #b4791a); border: none; color: #f0d493;
      border-radius: 10px; padding: 10px 14px; font-weight: 800; cursor: pointer; font: inherit;
    }
    #place-interior .pi-quick { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
    #place-interior .pi-quick button {
      background: rgba(42, 34, 26,0.9); border: 1px solid #57534e; color: #e8ddc0;
      border-radius: 999px; padding: 6px 10px; font-size: 0.78rem; cursor: pointer; font: inherit;
    }
    #enter-prompt {
      position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%);
      z-index: 35; display: none; pointer-events: none;
      background: rgba(24, 20, 14,0.92); border: 1px solid #f0d493; color: #f0d493;
      padding: 8px 14px; border-radius: 999px; font-size: 0.82rem; font-weight: 800;
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    }
    #enter-prompt.show { display: block; }
    body.place-inside #topbar,
    body.place-inside #dock,
    body.place-inside #btn-open-chat3d { opacity: 0.35; pointer-events: none; }
  </style>
</head>
<body>
  <div id="canvas-host"></div>
  <div id="enter-prompt" aria-live="polite">E · Enter</div>
  <div id="place-interior" role="dialog" aria-label="Interior visit" aria-modal="true">
    <div class="pi-head">
      <button type="button" class="pi-exit" id="pi-exit">← Leave</button>
      <div>
        <h2 id="pi-title">House</h2>
        <div class="pi-sub" id="pi-sub">interior visit</div>
      </div>
    </div>
    <div class="pi-body">
      <div class="pi-room" id="pi-room">
        <div class="pi-room-glow"></div>
        <div class="pi-room-window"></div>
        <div class="pi-room-floor"></div>
        <div class="pi-room-label" id="pi-room-label">Inside</div>
      </div>
      <div class="pi-host">
        <div class="pi-host-row">
          <div class="pi-portrait" id="pi-portrait">
            <img id="pi-portrait-img" alt="" />
            <span class="pi-glyph" id="pi-glyph">🌙</span>
          </div>
          <div class="pi-host-meta">
            <h3 id="pi-host-name">Host</h3>
            <span class="pi-home-badge away" id="pi-home-badge">Away</span>
            <p class="pi-vibe" id="pi-vibe">Warm light through the glass.</p>
          </div>
        </div>
        <p class="pi-guests" id="pi-guests-label">Talk to someone here:</p>
        <div class="pi-guest-list" id="pi-guest-list"></div>
        <div class="pi-bubble" id="pi-bubble">Welcome in.</div>
      </div>
    </div>
    <div class="pi-talk">
      <div class="pi-quick" id="pi-quick"></div>
      <input id="pi-input" maxlength="400" placeholder="Talk inside…" autocomplete="off" />
      <button type="button" id="pi-send">Send</button>
    </div>
  </div>
  <div id="boot-overlay" aria-live="polite">
    <div class="boot-card">
      <div class="boot-title">✦ Luna Camp 3D</div>
      <div class="boot-step" id="boot-step">Starting free local meadow…</div>
      <div class="boot-hint" id="boot-hint">Free brains = this PC (Ollama). telephanti.com cloud can bill xAI — use 127.0.0.1:8767 when broke.</div>
    </div>
  </div>
  <div id="speech-layer"></div>
  <div id="prop-toast"></div>
  <div id="carry-hud" hidden aria-live="polite"></div>
  <button type="button" id="act-fab" title="Actions: take, give, drop" aria-label="Actions">✋</button>
  <div id="act-sheet" role="menu" aria-label="Carry actions" aria-hidden="true">
    <div class="act-status" id="act-status">Hands empty</div>
    <button type="button" data-act="take" class="primary">📥 Take nearest</button>
    <button type="button" data-act="give">🎁 Give to friend</button>
    <button type="button" data-act="drop">⬇️ Drop</button>
    <button type="button" data-act="close">✕ Close</button>
  </div>
  <div id="mode-pill" hidden aria-hidden="true"></div>

  <header id="topbar">
    <a id="home-telephanti" class="chip" href="https://telephanti.com/" title="Back to telephanti.com home">← Home</a>
    <div class="tx-cluster" title="Telephantix music + site">
      <button type="button" id="album-btn" class="chip" title="Play / show Telephantix radio">♪ Play music</button>
      <a id="telephanti-site-btn" class="chip" href="https://telephanti.com/" title="Back to telephanti.com">telephanti.com</a>
    </div>
    <span id="album-now" hidden></span>
    <button type="button" id="btn-firmament-3d" class="chip" title="Open Firmament so flyers may take the sky">📡 Firmament</button>
    <button type="button" id="btn-heaven-3d" class="chip" title="Summon Jesus, archangels, Thor &amp; Zeus"
      style="border-color:#f0d493;background:linear-gradient(135deg,#2a2620,#f59e0b 55%,#f0d493);color:#17140f;font-weight:900">✦ Heaven</button>
    <button type="button" id="btn-reset-cam" class="chip">Find me</button>
    <button type="button" id="btn-follow" class="chip" title="Camera follow">Follow</button>
    <button type="button" id="btn-banter-top" class="chip" title="Pair banter">💬</button>
    <button type="button" id="btn-powwow-top" class="chip" title="Gather a circle conversation">🔥 Circle</button>
    <button type="button" id="btn-roam" class="chip">🏃</button>
    <span id="status" hidden aria-hidden="true"></span>
    <span id="stamp" hidden aria-hidden="true"></span>
  </header>
  <div id="boot-error" hidden style="position:fixed;inset:auto 12px 120px 12px;z-index:40;background:rgba(156,31,31,0.95);border:1px solid #9c1f1f;border-radius:12px;padding:14px 16px;color:#f0d493;font-size:0.85rem;line-height:1.45;max-width:560px;margin:0 auto;left:12px;right:12px;"></div>

  <div id="dock">
    <div id="quick-bar">
      <!-- Hey / Joke / Pulse / Love removed — cluttered mobile under hub chrome -->
      <button type="button" id="banter">💬 Banter</button>
      <button type="button" id="powwow">🔥 Circle</button>
    </div>
    <div id="talk-row">

      <button type="button" class="btn-all-agents" id="btn-all-agents" title="Speak to every agent on the meadow">✦ All</button>
      <div class="who-dd" id="who-dd">
        <button type="button" class="who-dd-btn" id="who-dd-btn" aria-haspopup="listbox" aria-expanded="false" title="Who to talk to">Talk to…</button>
        <div class="who-dd-menu" id="who-dd-menu" role="listbox" hidden></div>
        <select id="who-select" class="who-select-native" aria-label="Talk to" tabindex="-1"></select>
      </div>
      <input id="msg" type="text" maxlength="500" placeholder="Type a message… then Send (or pick ✦ All)" autocomplete="off" />
      <button type="button" id="send">Send</button>
    </div>
    <div id="hint" hidden aria-hidden="true"></div>
  </div>

  <button type="button" id="btn-clear-bubbles" title="Close all world speech bubbles" aria-label="Clear speech bubbles">✕ Bubbles</button>
  <!-- Talk chatlog panel removed — speak via dock + world speech bubbles only -->
  <button type="button" id="btn-open-chat3d" hidden aria-hidden="true" tabindex="-1" style="display:none!important"></button>
  <div id="chat3d-panel" hidden aria-hidden="true" style="display:none!important">
    <select id="chat3d-who" hidden aria-hidden="true"></select>
    <div id="chat3d-thread" hidden aria-hidden="true"></div>
    <textarea id="chat3d-input" hidden aria-hidden="true"></textarea>
    <button type="button" id="chat3d-send" hidden aria-hidden="true"></button>
    <span id="chat3d-ethereal" hidden></span>
    <button type="button" id="chat3d-close" hidden></button>
  </div>

    <!-- External progressive boot (tiny) → full app module -->
  <script type="module" src="/static/firmament-three-boot.mjs?v=2026-10-14-pixelgpu"></script>

  <script src="/static/world-nav.js?v=warcamp3" defer></script>
</body>
</html>
